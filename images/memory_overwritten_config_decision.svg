<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1060" font-family="'Segoe UI','Noto Sans SC',Arial,sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
    <linearGradient id="hProd" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2e7d32"/><stop offset="100%" stop-color="#43a047"/></linearGradient>
    <linearGradient id="hDev" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1565c0"/><stop offset="100%" stop-color="#1e88e5"/></linearGradient>
    <linearGradient id="hHW" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6a1b9a"/><stop offset="100%" stop-color="#8e24aa"/></linearGradient>
    <linearGradient id="hCI" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e65100"/><stop offset="100%" stop-color="#f57c00"/></linearGradient>
    <linearGradient id="hTitle" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#37474f"/><stop offset="100%" stop-color="#546e7a"/></linearGradient>
  </defs>

  <!-- 标题 -->
  <text x="640" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">图 5.8-1 — MemoryOverwritten 配置选择决策图</text>
  <text x="640" y="52" text-anchor="middle" font-size="11" fill="#78909c">根据使用场景选择最优内核配置组合 · Linux 6.18.1</text>

  <!-- ===== 决策起点 ===== -->
  <g transform="translate(490,75)">
    <polygon points="150,0 300,40 150,80 0,40" fill="#fff3e0" stroke="#e65100" stroke-width="2" filter="url(#sh)"/>
    <text x="150" y="36" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">使用场景？</text>
    <text x="150" y="52" text-anchor="middle" font-size="10" fill="#bf360c">选择部署环境</text>
  </g>

  <!-- 四条分支标签 -->
  <line x1="540" y1="155" x2="200" y2="220" stroke="#2e7d32" stroke-width="2"/>
  <text x="340" y="178" font-size="10" font-weight="bold" fill="#2e7d32">生产环境</text>
  <line x1="610" y1="155" x2="480" y2="220" stroke="#1565c0" stroke-width="2"/>
  <text x="530" y="178" font-size="10" font-weight="bold" fill="#1565c0">开发调试</text>
  <line x1="680" y1="155" x2="780" y2="220" stroke="#6a1b9a" stroke-width="2"/>
  <text x="710" y="178" font-size="10" font-weight="bold" fill="#6a1b9a">ARM64 MTE</text>
  <line x1="740" y1="155" x2="1060" y2="220" stroke="#e65100" stroke-width="2"/>
  <text x="900" y="178" font-size="10" font-weight="bold" fill="#e65100">CI/自动化</text>

  <!-- ===== 生产环境 ===== -->
  <g transform="translate(30,220)">
    <rect width="340" height="350" rx="8" fill="#fff" stroke="#2e7d32" stroke-width="2" filter="url(#sh)"/>
    <rect width="340" height="30" rx="8" fill="url(#hProd)"/>
    <rect y="22" width="340" height="8" fill="#43a047"/>
    <text x="170" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">生产环境推荐配置</text>
    <text x="15" y="48" font-size="10" font-weight="bold" fill="#2e7d32">低开销 · 适合 7×24 运行</text>

    <line x1="10" y1="58" x2="330" y2="58" stroke="#c8e6c9" stroke-width="0.8"/>
    <text x="15" y="75" font-size="10" font-weight="bold" fill="#333">采样检测层</text>
    <text x="20" y="92" font-family="monospace" font-size="10" fill="#1b5e20">CONFIG_KFENCE=y</text>
    <text x="220" y="92" font-size="9" fill="#666">采样电子围栏</text>
    <text x="20" y="108" font-family="monospace" font-size="10" fill="#1b5e20">KFENCE_SAMPLE_INTERVAL=100</text>
    <text x="250" y="108" font-size="9" fill="#666">100ms</text>
    <text x="20" y="124" font-family="monospace" font-size="10" fill="#1b5e20">KFENCE_NUM_OBJECTS=255</text>
    <text x="250" y="124" font-size="9" fill="#666">默认池</text>

    <line x1="10" y1="134" x2="330" y2="134" stroke="#c8e6c9" stroke-width="0.8"/>
    <text x="15" y="151" font-size="10" font-weight="bold" fill="#333">编译期防御层</text>
    <text x="20" y="168" font-family="monospace" font-size="10" fill="#1b5e20">CONFIG_FORTIFY_SOURCE=y</text>
    <text x="250" y="168" font-size="9" fill="#666">str/mem 校验</text>
    <text x="20" y="184" font-family="monospace" font-size="10" fill="#1b5e20">CONFIG_STACKPROTECTOR_STRONG=y</text>
    <text x="20" y="200" font-family="monospace" font-size="10" fill="#1b5e20">CONFIG_HARDENED_USERCOPY=y</text>

    <line x1="10" y1="210" x2="330" y2="210" stroke="#c8e6c9" stroke-width="0.8"/>
    <text x="15" y="227" font-size="10" font-weight="bold" fill="#333">分配器加固层</text>
    <text x="20" y="244" font-family="monospace" font-size="10" fill="#1b5e20">SLAB_FREELIST_HARDENED=y</text>
    <text x="250" y="244" font-size="9" fill="#666">指针加固</text>
    <text x="20" y="260" font-family="monospace" font-size="10" fill="#1b5e20">SLAB_FREELIST_RANDOM=y</text>
    <text x="250" y="260" font-size="9" fill="#666">随机化</text>
    <text x="20" y="276" font-family="monospace" font-size="10" fill="#1b5e20">INIT_ON_ALLOC_DEFAULT_ON=y</text>
    <text x="250" y="276" font-size="9" fill="#666">分配清零</text>

    <line x1="10" y1="286" x2="330" y2="286" stroke="#c8e6c9" stroke-width="0.8"/>
    <text x="15" y="303" font-size="10" font-weight="bold" fill="#333">内核保护层</text>
    <text x="20" y="320" font-family="monospace" font-size="10" fill="#1b5e20">CONFIG_STRICT_KERNEL_RWX=y</text>
    <text x="250" y="320" font-size="9" fill="#666">代码段只读</text>
    <text x="20" y="336" font-family="monospace" font-size="10" fill="#1b5e20">CONFIG_LIST_HARDENED=y</text>
    <text x="250" y="336" font-size="9" fill="#666">链表加固</text>

    <rect x="10" y="348" width="70" height="16" rx="3" fill="#e8f5e9" stroke="#66bb6a" stroke-width="0.8"/>
    <text x="45" y="360" text-anchor="middle" font-size="9" font-weight="bold" fill="#2e7d32">&lt;1% 开销</text>
  </g>

  <!-- ===== 开发调试 ===== -->
  <g transform="translate(400,220)">
    <rect width="340" height="350" rx="8" fill="#fff" stroke="#1565c0" stroke-width="2" filter="url(#sh)"/>
    <rect width="340" height="30" rx="8" fill="url(#hDev)"/>
    <rect y="22" width="340" height="8" fill="#1e88e5"/>
    <text x="170" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">开发调试推荐配置</text>
    <text x="15" y="48" font-size="10" font-weight="bold" fill="#1565c0">最大覆盖 · 性能不敏感</text>

    <line x1="10" y1="58" x2="330" y2="58" stroke="#bbdefb" stroke-width="0.8"/>
    <text x="15" y="75" font-size="10" font-weight="bold" fill="#333">KASAN 全量检测</text>
    <text x="20" y="92" font-family="monospace" font-size="10" fill="#0d47a1">CONFIG_KASAN_GENERIC=y</text>
    <text x="240" y="92" font-size="9" fill="#666">Shadow Memory</text>
    <text x="20" y="108" font-family="monospace" font-size="10" fill="#0d47a1">CONFIG_KASAN_INLINE=y</text>
    <text x="240" y="108" font-size="9" fill="#666">内联插桩</text>
    <text x="20" y="124" font-family="monospace" font-size="10" fill="#0d47a1">CONFIG_KASAN_STACK=y</text>
    <text x="240" y="124" font-size="9" fill="#666">栈变量检测</text>
    <text x="20" y="140" font-family="monospace" font-size="10" fill="#0d47a1">CONFIG_KASAN_VMALLOC=y</text>
    <text x="240" y="140" font-size="9" fill="#666">vmalloc 检测</text>
    <text x="20" y="156" font-family="monospace" font-size="10" fill="#0d47a1">CONFIG_KASAN_EXTRA_INFO=y</text>
    <text x="240" y="156" font-size="9" fill="#666">CPU+时间戳</text>

    <line x1="10" y1="166" x2="330" y2="166" stroke="#bbdefb" stroke-width="0.8"/>
    <text x="15" y="183" font-size="10" font-weight="bold" fill="#333">SLUB Debug 全开</text>
    <text x="20" y="200" font-family="monospace" font-size="10" fill="#0d47a1">CONFIG_SLUB_DEBUG_ON=y</text>
    <text x="240" y="200" font-size="9" fill="#666">等价 slub_debug=FZP</text>
    <text x="20" y="216" font-family="monospace" font-size="10" fill="#0d47a1">Boot: slub_debug=FZPU</text>
    <text x="240" y="216" font-size="9" fill="#666">含 track</text>
    <text x="20" y="232" font-family="monospace" font-size="10" fill="#0d47a1">Boot: slub_nomerge</text>
    <text x="240" y="232" font-size="9" fill="#666">禁止合并</text>

    <line x1="10" y1="242" x2="330" y2="242" stroke="#bbdefb" stroke-width="0.8"/>
    <text x="15" y="259" font-size="10" font-weight="bold" fill="#333">页级检测</text>
    <text x="20" y="276" font-family="monospace" font-size="10" fill="#0d47a1">CONFIG_DEBUG_PAGEALLOC=y</text>
    <text x="240" y="276" font-size="9" fill="#666">页释放 unmap</text>
    <text x="20" y="292" font-family="monospace" font-size="10" fill="#0d47a1">CONFIG_PAGE_OWNER=y</text>
    <text x="240" y="292" font-size="9" fill="#666">页分配追踪</text>
    <text x="20" y="308" font-family="monospace" font-size="10" fill="#0d47a1">CONFIG_PAGE_TABLE_CHECK=y</text>
    <text x="240" y="308" font-size="9" fill="#666">页表校验</text>

    <line x1="10" y1="318" x2="330" y2="318" stroke="#bbdefb" stroke-width="0.8"/>
    <text x="15" y="335" font-size="10" font-weight="bold" fill="#333">附加防御</text>
    <text x="20" y="352" font-family="monospace" font-size="10" fill="#0d47a1">CONFIG_DEBUG_LIST=y</text>
    <text x="240" y="352" font-size="9" fill="#666">链表完整性</text>

    <rect x="10" y="362" width="80" height="16" rx="3" fill="#e3f2fd" stroke="#42a5f5" stroke-width="0.8"/>
    <text x="50" y="374" text-anchor="middle" font-size="9" font-weight="bold" fill="#1565c0">~3× 性能开销</text>
  </g>

  <!-- ===== ARM64 MTE ===== -->
  <g transform="translate(770,220)">
    <rect width="240" height="220" rx="8" fill="#fff" stroke="#6a1b9a" stroke-width="2" filter="url(#sh)"/>
    <rect width="240" height="30" rx="8" fill="url(#hHW)"/>
    <rect y="22" width="240" height="8" fill="#8e24aa"/>
    <text x="120" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">ARM64 MTE 硬件加速</text>
    <text x="15" y="48" font-size="10" font-weight="bold" fill="#6a1b9a">ARMv8.5+ 专属 · 低开销</text>

    <line x1="10" y1="58" x2="230" y2="58" stroke="#e1bee7" stroke-width="0.8"/>
    <text x="15" y="75" font-size="10" font-weight="bold" fill="#333">硬件标签 KASAN</text>
    <text x="20" y="92" font-family="monospace" font-size="10" fill="#4a148c">CONFIG_KASAN_HW_TAGS=y</text>
    <text x="20" y="108" font-family="monospace" font-size="10" fill="#4a148c">CONFIG_KASAN_VMALLOC=y</text>

    <line x1="10" y1="118" x2="230" y2="118" stroke="#e1bee7" stroke-width="0.8"/>
    <text x="15" y="135" font-size="10" font-weight="bold" fill="#333">启动参数</text>
    <text x="20" y="152" font-family="monospace" font-size="10" fill="#4a148c">kasan.mode=sync</text>
    <text x="160" y="152" font-size="9" fill="#666">同步检测</text>
    <text x="20" y="168" font-family="monospace" font-size="10" fill="#4a148c">kasan.mode=asymm</text>
    <text x="160" y="168" font-size="9" fill="#666">读异步写同步</text>

    <line x1="10" y1="178" x2="230" y2="178" stroke="#e1bee7" stroke-width="0.8"/>
    <text x="15" y="195" font-size="10" font-weight="bold" fill="#333">前提条件</text>
    <text x="20" y="210" font-size="10" fill="#333">• SoC 支持 ARMv8.5-MemTag</text>
    <text x="20" y="226" font-size="10" fill="#333">• GCC 10+ / Clang 12+</text>

    <rect x="10" y="240" width="90" height="16" rx="3" fill="#f3e5f5" stroke="#ab47bc" stroke-width="0.8"/>
    <text x="55" y="252" text-anchor="middle" font-size="9" font-weight="bold" fill="#6a1b9a">~5% 性能开销</text>
  </g>

  <!-- ===== CI/自动化 ===== -->
  <g transform="translate(1040,220)">
    <rect width="220" height="220" rx="8" fill="#fff" stroke="#e65100" stroke-width="2" filter="url(#sh)"/>
    <rect width="220" height="30" rx="8" fill="url(#hCI)"/>
    <rect y="22" width="220" height="8" fill="#f57c00"/>
    <text x="110" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">CI / 自动化测试</text>
    <text x="15" y="48" font-size="10" font-weight="bold" fill="#e65100">覆盖 + 回归 · 可重复</text>

    <line x1="10" y1="58" x2="210" y2="58" stroke="#ffe0b2" stroke-width="0.8"/>
    <text x="15" y="75" font-size="10" font-weight="bold" fill="#333">必选项</text>
    <text x="20" y="92" font-family="monospace" font-size="9" fill="#bf360c">KASAN_GENERIC=y</text>
    <text x="20" y="108" font-family="monospace" font-size="9" fill="#bf360c">KASAN_INLINE=y</text>
    <text x="20" y="124" font-family="monospace" font-size="9" fill="#bf360c">KFENCE=y</text>
    <text x="20" y="140" font-family="monospace" font-size="9" fill="#bf360c">SLUB_DEBUG=y</text>

    <line x1="10" y1="150" x2="210" y2="150" stroke="#ffe0b2" stroke-width="0.8"/>
    <text x="15" y="167" font-size="10" font-weight="bold" fill="#333">故障策略</text>
    <text x="20" y="184" font-family="monospace" font-size="9" fill="#bf360c">kasan.fault=panic</text>
    <text x="150" y="184" font-size="8" fill="#666">立即终止</text>
    <text x="20" y="200" font-family="monospace" font-size="9" fill="#bf360c">slub_debug=FZPU</text>
    <text x="150" y="200" font-size="8" fill="#666">全检查</text>
    <text x="20" y="216" font-family="monospace" font-size="9" fill="#bf360c">panic_on_warn=1</text>
    <text x="150" y="216" font-size="8" fill="#666">警告即停</text>

    <rect x="10" y="230" width="100" height="16" rx="3" fill="#fff3e0" stroke="#ff9800" stroke-width="0.8"/>
    <text x="60" y="242" text-anchor="middle" font-size="9" font-weight="bold" fill="#e65100">最大化检测率</text>
  </g>

  <!-- ===== 底部性能对比表 ===== -->
  <g transform="translate(30,610)">
    <rect width="1220" height="230" rx="8" fill="#fff" stroke="#546e7a" stroke-width="2" filter="url(#sh)"/>
    <rect width="1220" height="30" rx="8" fill="url(#hTitle)"/>
    <rect y="22" width="1220" height="8" fill="#546e7a"/>
    <text x="610" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">各场景配置性能影响与检测能力对比</text>

    <!-- 表头 -->
    <text x="30" y="52" font-size="11" font-weight="bold" fill="#37474f">配置项</text>
    <text x="400" y="52" font-size="11" font-weight="bold" fill="#37474f">性能开销</text>
    <text x="560" y="52" font-size="11" font-weight="bold" fill="#37474f">内存开销</text>
    <text x="720" y="52" font-size="11" font-weight="bold" fill="#37474f">检测能力</text>
    <text x="960" y="52" font-size="11" font-weight="bold" fill="#37474f">推荐场景</text>
    <line x1="20" y1="58" x2="1200" y2="58" stroke="#cfd8dc" stroke-width="1"/>

    <!-- KASAN Generic -->
    <text x="30" y="78" font-family="monospace" font-size="10" fill="#333">KASAN_GENERIC</text>
    <rect x="390" y="66" width="120" height="16" rx="3" fill="#ffcdd2"/>
    <text x="450" y="78" text-anchor="middle" font-size="10" fill="#c62828">~3× 减速</text>
    <rect x="550" y="66" width="120" height="16" rx="3" fill="#ffcdd2"/>
    <text x="610" y="78" text-anchor="middle" font-size="10" fill="#c62828">+1/8 内存</text>
    <rect x="710" y="66" width="180" height="16" rx="3" fill="#c8e6c9"/>
    <text x="800" y="78" text-anchor="middle" font-size="10" fill="#2e7d32">OOB + UAF + 全局</text>
    <text x="960" y="78" font-size="10" fill="#333">开发 / CI</text>

    <!-- KASAN HW_TAGS -->
    <text x="30" y="102" font-family="monospace" font-size="10" fill="#333">KASAN_HW_TAGS</text>
    <rect x="390" y="90" width="120" height="16" rx="3" fill="#fff9c4"/>
    <text x="450" y="102" text-anchor="middle" font-size="10" fill="#f57f17">~5% 减速</text>
    <rect x="550" y="90" width="120" height="16" rx="3" fill="#fff9c4"/>
    <text x="610" y="102" text-anchor="middle" font-size="10" fill="#f57f17">+1/32 内存</text>
    <rect x="710" y="90" width="180" height="16" rx="3" fill="#c8e6c9"/>
    <text x="800" y="102" text-anchor="middle" font-size="10" fill="#2e7d32">OOB + UAF (堆)</text>
    <text x="960" y="102" font-size="10" fill="#333">ARM64 生产/预发布</text>

    <!-- KFENCE -->
    <text x="30" y="126" font-family="monospace" font-size="10" fill="#333">KFENCE</text>
    <rect x="390" y="114" width="120" height="16" rx="3" fill="#c8e6c9"/>
    <text x="450" y="126" text-anchor="middle" font-size="10" fill="#2e7d32">&lt;1%</text>
    <rect x="550" y="114" width="120" height="16" rx="3" fill="#c8e6c9"/>
    <text x="610" y="126" text-anchor="middle" font-size="10" fill="#2e7d32">~2MB 固定</text>
    <rect x="710" y="114" width="180" height="16" rx="3" fill="#fff9c4"/>
    <text x="800" y="126" text-anchor="middle" font-size="10" fill="#f57f17">采样 OOB + UAF</text>
    <text x="960" y="126" font-size="10" fill="#333">生产环境</text>

    <!-- SLUB Debug -->
    <text x="30" y="150" font-family="monospace" font-size="10" fill="#333">SLUB_DEBUG (FZPU)</text>
    <rect x="390" y="138" width="120" height="16" rx="3" fill="#ffcdd2"/>
    <text x="450" y="150" text-anchor="middle" font-size="10" fill="#c62828">~2× 减速</text>
    <rect x="550" y="138" width="120" height="16" rx="3" fill="#fff9c4"/>
    <text x="610" y="150" text-anchor="middle" font-size="10" fill="#f57f17">+10~20%</text>
    <rect x="710" y="138" width="180" height="16" rx="3" fill="#c8e6c9"/>
    <text x="800" y="150" text-anchor="middle" font-size="10" fill="#2e7d32">OOB + UAF + DF</text>
    <text x="960" y="150" font-size="10" fill="#333">开发 / 定向排查</text>

    <!-- FORTIFY_SOURCE -->
    <text x="30" y="174" font-family="monospace" font-size="10" fill="#333">FORTIFY_SOURCE</text>
    <rect x="390" y="162" width="120" height="16" rx="3" fill="#c8e6c9"/>
    <text x="450" y="174" text-anchor="middle" font-size="10" fill="#2e7d32">可忽略</text>
    <rect x="550" y="162" width="120" height="16" rx="3" fill="#c8e6c9"/>
    <text x="610" y="174" text-anchor="middle" font-size="10" fill="#2e7d32">无</text>
    <rect x="710" y="162" width="180" height="16" rx="3" fill="#fff9c4"/>
    <text x="800" y="174" text-anchor="middle" font-size="10" fill="#f57f17">编译期 str/mem 越界</text>
    <text x="960" y="174" font-size="10" fill="#333">所有场景</text>

    <!-- STACKPROTECTOR_STRONG -->
    <text x="30" y="198" font-family="monospace" font-size="10" fill="#333">STACKPROTECTOR_STRONG</text>
    <rect x="390" y="186" width="120" height="16" rx="3" fill="#c8e6c9"/>
    <text x="450" y="198" text-anchor="middle" font-size="10" fill="#2e7d32">~0.3%</text>
    <rect x="550" y="186" width="120" height="16" rx="3" fill="#c8e6c9"/>
    <text x="610" y="198" text-anchor="middle" font-size="10" fill="#2e7d32">+8B/栈帧</text>
    <rect x="710" y="186" width="180" height="16" rx="3" fill="#fff9c4"/>
    <text x="800" y="198" text-anchor="middle" font-size="10" fill="#f57f17">栈缓冲区溢出</text>
    <text x="960" y="198" font-size="10" fill="#333">所有场景</text>

    <!-- DEBUG_PAGEALLOC -->
