<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="'Segoe UI','Noto Sans SC',Arial,sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/></filter>
    <linearGradient id="hZr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e74c3c"/><stop offset="100%" stop-color="#c0392b"/></linearGradient>
    <linearGradient id="hZs" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2980b9"/><stop offset="100%" stop-color="#1a5276"/></linearGradient>
    <linearGradient id="hZm" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#27ae60"/><stop offset="100%" stop-color="#1e8449"/></linearGradient>
    <linearGradient id="hAl" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8e44ad"/><stop offset="100%" stop-color="#6c3483"/></linearGradient>
    <linearGradient id="hRc" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#d35400"/><stop offset="100%" stop-color="#a04000"/></linearGradient>
    <marker id="aw" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#555" stroke-width="1.5" stroke-linejoin="round"/></marker>
    <marker id="awR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-linejoin="round"/></marker>
    <marker id="awB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#2980b9" stroke-width="1.5" stroke-linejoin="round"/></marker>
  </defs>

  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">Linux 内核内存压缩机制：zram / zswap / zsmalloc 架构全景</text>
  <text x="600" y="50" text-anchor="middle" font-size="11" fill="#7f8c8d">源码: drivers/block/zram/zram_drv.c, mm/zswap.c, mm/zsmalloc.c</text>

  <!-- ========== Top: Data Flow ========== -->
  <!-- Page Reclaim Entry -->
  <g transform="translate(40,70)" filter="url(#sh)">
    <rect width="200" height="60" rx="8" fill="#fff" stroke="#d35400" stroke-width="2"/>
    <rect width="200" height="28" rx="8" fill="url(#hRc)"/>
    <rect x="0" y="20" width="200" height="8" fill="#a04000"/>
    <text x="100" y="19" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">页面回收 (mm/vmscan.c)</text>
    <text x="100" y="50" text-anchor="middle" font-size="10" fill="#555">shrink_folio_list() → pageout()</text>
  </g>

  <!-- zswap path -->
  <g transform="translate(340,70)" filter="url(#sh)">
    <rect width="340" height="130" rx="8" fill="#fff" stroke="#2980b9" stroke-width="2"/>
    <rect width="340" height="28" rx="8" fill="url(#hZs)"/>
    <rect x="0" y="20" width="340" height="8" fill="#1a5276"/>
    <text x="170" y="19" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">zswap — Swap 缓存压缩层 (mm/zswap.c)</text>
    <text x="15" y="46" font-size="10" fill="#2980b9" font-weight="bold">在 swap-out 路径拦截，压缩后缓存在 RAM</text>
    <line x1="10" y1="53" x2="330" y2="53" stroke="#d6eaf8" stroke-width="0.8"/>
    <text x="15" y="70" font-size="9.5" fill="#555">1. zswap_store() 拦截 swap write</text>
    <text x="15" y="86" font-size="9.5" fill="#555">2. crypto_acomp 压缩页面数据</text>
    <text x="15" y="102" font-size="9.5" fill="#555">3. zsmalloc 分配压缩数据空间</text>
    <text x="15" y="118" font-size="9.5" fill="#555">4. 插入 xarray 索引(按 swap entry)</text>
    <text x="15" y="126" font-size="9.5" fill="#2980b9">超限时 writeback 到真实 swap 设备</text>
  </g>

  <!-- zram path -->
  <g transform="translate(780,70)" filter="url(#sh)">
    <rect width="380" height="130" rx="8" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
    <rect width="380" height="28" rx="8" fill="url(#hZr)"/>
    <rect x="0" y="20" width="380" height="8" fill="#c0392b"/>
    <text x="190" y="19" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">zram — RAM 压缩块设备 (drivers/block/zram/)</text>
    <text x="15" y="46" font-size="10" fill="#e74c3c" font-weight="bold">创建 /dev/zramN 块设备，作为 swap 后端</text>
    <line x1="10" y1="53" x2="370" y2="53" stroke="#fde8e8" stroke-width="0.8"/>
    <text x="15" y="70" font-size="9.5" fill="#555">1. mkswap /dev/zram0 &amp;&amp; swapon /dev/zram0</text>
    <text x="15" y="86" font-size="9.5" fill="#555">2. swap 写入 → zram_write_page()</text>
    <text x="15" y="102" font-size="9.5" fill="#555">3. 压缩 (lzo/lz4/zstd) + zsmalloc 存储</text>
    <text x="15" y="118" font-size="9.5" fill="#555">4. swap 读取 → zram_read_page() → 解压</text>
    <text x="15" y="126" font-size="9.5" fill="#e74c3c">纯 RAM，不需要物理 swap 设备</text>
  </g>

  <!-- Arrows from reclaim -->
  <path d="M240,100 L340,100" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#aw)"/>
  <rect x="247" y="88" width="85" height="16" rx="3" fill="white" fill-opacity="0.95"/>
  <text x="290" y="100" text-anchor="middle" font-size="9" fill="#555">swap_writepage</text>

  <path d="M240,100 L240,250 L780,250 L780,200" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#aw)"/>
  <rect x="440" y="240" width="120" height="16" rx="3" fill="white" fill-opacity="0.95"/>
  <text x="500" y="252" text-anchor="middle" font-size="9" fill="#555">zram 作为 swap 后端</text>

  <!-- ========== Middle: zsmalloc ========== -->
  <g transform="translate(40,260)" filter="url(#sh)">
    <rect width="660" height="200" rx="8" fill="#fff" stroke="#27ae60" stroke-width="2"/>
    <rect width="660" height="28" rx="8" fill="url(#hZm)"/>
    <rect x="0" y="20" width="660" height="8" fill="#1e8449"/>
    <text x="330" y="19" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">zsmalloc — 压缩页面专用分配器 (mm/zsmalloc.c)</text>
    <text x="15" y="46" font-size="10" fill="#27ae60" font-weight="bold">为任意大小的压缩对象提供紧凑内存分配</text>
    <line x1="10" y1="53" x2="650" y2="53" stroke="#d5f5e3" stroke-width="0.8"/>
    <text x="15" y="70" font-size="10" fill="#555" font-weight="bold">核心设计: size_class 分级 + 跨页面存储</text>
    <text x="20" y="88" font-size="9.5" fill="#555">• 按对象大小分成多个 size_class (ZS_MIN_ALLOC_SIZE ~ PAGE_SIZE)</text>
    <text x="20" y="106" font-size="9.5" fill="#555">• 每个 size_class 管理若干 zspage (由 1~4 个物理页组成)</text>
    <text x="20" y="124" font-size="9.5" fill="#555">• 一个 zspage 内可存储多个同 class 的压缩对象，利用率极高</text>
    <text x="20" y="142" font-size="9.5" fill="#555">• zs_map_object() / zs_unmap_object() — 临时映射访问跨页对象</text>
    <line x1="10" y1="152" x2="650" y2="152" stroke="#d5f5e3" stroke-width="0.8"/>
    <text x="15" y="170" font-size="10" fill="#555" font-weight="bold">zspage 内存布局:</text>
    <text x="20" y="188" font-size="9.5" font-family="monospace" fill="#27ae60">│ obj0 │ obj1 │ obj2(跨页)│ obj3 │ obj4 │ ... │ free space │</text>
    <text x="20" y="203" font-size="9" fill="#888">page 0                    │ page 1                    │ page 2</text>
    <text x="20" y="220" font-size="9.5" fill="#555">→ 对象可以跨越物理页边界，最大化内存利用率（vs slab 不能跨页）</text>
    <text x="20" y="240" font-size="9.5" fill="#555">→ 支持 compaction: 将稀疏 zspage 合并为满 zspage + 释放空闲页</text>
  </g>

  <!-- ========== Middle Right: Compression Algorithms ========== -->
  <g transform="translate(750,260)" filter="url(#sh)">
    <rect width="420" height="200" rx="8" fill="#fff" stroke="#8e44ad" stroke-width="2"/>
    <rect width="420" height="28" rx="8" fill="url(#hAl)"/>
    <rect x="0" y="20" width="420" height="8" fill="#6c3483"/>
    <text x="210" y="19" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">压缩算法内核实现</text>
    <text x="15" y="46" font-size="10" fill="#8e44ad" font-weight="bold">通过 crypto API 调用，支持多种算法</text>
    <line x1="10" y1="53" x2="410" y2="53" stroke="#e8daef" stroke-width="0.8"/>
    <text x="20" y="73" font-size="10" fill="#555" font-weight="bold">算法</text>
    <text x="110" y="73" font-size="10" fill="#555" font-weight="bold">压缩率</text>
    <text x="200" y="73" font-size="10" fill="#555" font-weight="bold">速度</text>
    <text x="290" y="73" font-size="10" fill="#555" font-weight="bold">适用场景</text>
    <line x1="10" y1="80" x2="410" y2="80" stroke="#e8daef" stroke-width="0.5"/>
    <text x="20" y="97" font-size="9.5" fill="#8e44ad">lzo/lzo-rle</text>
    <text x="110" y="97" font-size="9.5">中等</text>
    <text x="200" y="97" font-size="9.5">非常快</text>
    <text x="290" y="97" font-size="9.5">默认选择，平衡</text>
    <text x="20" y="115" font-size="9.5" fill="#8e44ad">lz4</text>
    <text x="110" y="115" font-size="9.5">较低</text>
    <text x="200" y="115" font-size="9.5">极快</text>
    <text x="290" y="115" font-size="9.5">延迟敏感场景</text>
    <text x="20" y="133" font-size="9.5" fill="#8e44ad">zstd</text>
    <text x="110" y="133" font-size="9.5">高</text>
    <text x="200" y="133" font-size="9.5">较慢</text>
    <text x="290" y="133" font-size="9.5">内存极度紧张</text>
    <text x="20" y="151" font-size="9.5" fill="#8e44ad">deflate</text>
    <text x="110" y="151" font-size="9.5">高</text>
    <text x="200" y="151" font-size="9.5">慢</text>
    <text x="290" y="151" font-size="9.5">特殊需求</text>
    <line x1="10" y1="162" x2="410" y2="162" stroke="#e8daef" stroke-width="0.5"/>
    <text x="15" y="180" font-size="10" fill="#555" font-weight="bold">ARM64 优化:</text>
    <text x="20" y="198" font-size="9.5" fill="#555">• NEON 加速的 lzo/lz4 实现</text>
    <text x="20" y="216" font-size="9.5" fill="#555">• per-CPU 压缩上下文避免锁竞争</text>
    <text x="20" y="234" font-size="9.5" fill="#555">• crypto_acomp 异步压缩 API</text>
  </g>

  <!-- ========== Bottom: zswap vs zram comparison ========== -->
  <g transform="translate(40,500)" filter="url(#sh)">
    <rect width="1120" height="260" rx="8" fill="#fff" stroke="#34495e" stroke-width="2"/>
    <rect width="1120" height="28" rx="8" fill="#34495e"/>
    <rect x="0" y="20" width="1120" height="8" fill="#2c3e50"/>
    <text x="560" y="19" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">zswap vs zram 对比 + 关键数据结构</text>
    <!-- Comparison -->
    <text x="80" y="48" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">维度</text>
    <text x="300" y="48" text-anchor="middle" font-size="10" fill="#2980b9" font-weight="bold">zswap</text>
    <text x="560" y="48" text-anchor="middle" font-size="10" fill="#e74c3c" font-weight="bold">zram</text>
    <line x1="10" y1="55" x2="720" y2="55" stroke="#eee" stroke-width="1"/>
    <text x="15" y="72" font-size="9.5" fill="#555">本质</text>
    <text x="300" y="72" text-anchor="middle" font-size="9.5">透明压缩缓存层(拦截swap-out)</text>
    <text x="560" y="72" text-anchor="middle" font-size="9.5">RAM 块设备(创建/dev/zramN)</text>
    <text x="15" y="90" font-size="9.5" fill="#555">是否需要 swap 设备</text>
    <text x="300" y="90" text-anchor="middle" font-size="9.5">需要(作为后备 writeback)</text>
    <text x="560" y="90" text-anchor="middle" font-size="9.5">不需要(自身就是 swap)</text>
    <text x="15" y="108" font-size="9.5" fill="#555">用户感知</text>
    <text x="300" y="108" text-anchor="middle" font-size="9.5">完全透明，自动启用</text>
    <text x="560" y="108" text-anchor="middle" font-size="9.5">需手动 mkswap + swapon</text>
    <text x="15" y="126" font-size="9.5" fill="#555">内存分配器</text>
    <text x="300" y="126" text-anchor="middle" font-size="9.5">zsmalloc</text>
    <text x="560" y="126" text-anchor="middle" font-size="9.5">zsmalloc</text>
    <text x="15" y="144" font-size="9.5" fill="#555">典型场景</text>
    <text x="300" y="144" text-anchor="middle" font-size="9.5">有磁盘swap的服务器/桌面</text>
    <text x="560" y="144" text-anchor="middle" font-size="9.5">无磁盘swap的嵌入式/Android</text>

    <!-- Key structs on the right -->
    <line x1="730" y1="37" x2="730" y2="255" stroke="#eee" stroke-width="1"/>
    <text x="745" y="48" font-size="10" fill="#2980b9" font-weight="bold">zswap_entry (mm/zswap.c)</text>
    <text x="750" y="66" font-size="9.5" font-family="monospace">swp_entry_t swpentry;</text>
    <text x="950" y="66" font-size="8.5" fill="#888">关联 swap entry</text>
    <text x="750" y="82" font-size="9.5" font-family="monospace">unsigned int length;</text>
    <text x="950" y="82" font-size="8.5" fill="#888">压缩后长度</text>
    <text x="750" y="98" font-size="9.5" font-family="monospace">struct zswap_pool *pool;</text>
    <text x="950" y="98" font-size="8.5" fill="#888">所属压缩池</text>
    <text x="750" y="114" font-size="9.5" font-family="monospace">unsigned long handle;</text>
    <text x="950" y="114" font-size="8.5" fill="#888">zsmalloc handle</text>
    <text x="750" y="130" font-size="9.5" font-family="monospace">struct list_head lru;</text>
    <text x="950" y="130" font-size="8.5" fill="#888">LRU 驱逐链表</text>
    <line x1="735" y1="140" x2="1110" y2="140" stroke="#eee" stroke-width="0.5"/>
    <text x="745" y="158" font-size="10" fill="#e74c3c" font-weight="bold">zram_table_entry (zram_drv.c)</text>
    <text x="750" y="176" font-size="9.5" font-family="monospace">unsigned long handle;</text>
    <text x="950" y="176" font-size="8.5" fill="#888">zsmalloc handle</text>
    <text x="750" y="192" font-size="9.5" font-family="monospace">unsigned int flags;</text>
    <text x="950" y="192" font-size="8.5" fill="#888">状态标志</text>
    <line x1="735" y1="202" x2="1110" y2="202" stroke="#eee" stroke-width="0.5"/>
    <text x="745" y="220" font-size="10" fill="#27ae60" font-weight="bold">zs_pool / zspage (zsmalloc.c)</text>
    <text x="750" y="238" font-size="9.5" font-family="monospace">size_class[N] → zspage链表</text>
    <text x="950" y="238" font-size="8.5" fill="#888">按大小分级</text>
    <text x="750" y="254" font-size="9.5" font-family="monospace">zspage: pages[] + freelist</text>
    <text x="950" y="254" font-size="8.5" fill="#888">1-4页组成</text>
  </g>

  <text x="600" y="775" text-anchor="middle" font-size="10" fill="#888">© Linux 6.18.1 | zram(红) — RAM块设备 | zswap(蓝) — swap压缩缓存 | zsmalloc(绿) — 紧凑分配器 | 压缩算法(紫)</text>
</svg>