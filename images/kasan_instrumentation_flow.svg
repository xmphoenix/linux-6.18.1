<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="'Segoe UI','Noto Sans SC',Arial,sans-serif">
  <defs>
    <filter id="sh2"><feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/></filter>
    <marker id="aFlow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <marker id="aRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <marker id="aGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="440" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">KASAN Generic 插桩检查流程 (memory_is_poisoned)</text>
  <text x="440" y="46" text-anchor="middle" font-size="10" fill="#64748b">源码: mm/kasan/generic.c — check_region_inline()</text>

  <!-- Step 1: Memory access -->
  <rect x="310" y="60" width="260" height="40" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#sh2)"/>
  <text x="440" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">用户代码: *ptr (load/store 操作)</text>

  <path d="M440,100 L440,125" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#aFlow)"/>

  <!-- Step 2: Shadow lookup -->
  <rect x="280" y="128" width="320" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#sh2)"/>
  <text x="440" y="148" text-anchor="middle" font-size="10" fill="#166534">计算 Shadow 地址</text>
  <text x="440" y="164" text-anchor="middle" font-size="9" font-family="monospace" fill="#166534">shadow = (ptr &gt;&gt; 3) + KASAN_SHADOW_OFFSET</text>

  <path d="M440,172 L440,197" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#aFlow)"/>

  <!-- Step 3: Read shadow -->
  <rect x="310" y="200" width="260" height="36" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#sh2)"/>
  <text x="440" y="222" text-anchor="middle" font-size="10" fill="#166534">读取 shadow_value = *(s8 *)shadow</text>

  <path d="M440,236 L440,261" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#aFlow)"/>

  <!-- Decision 1: shadow == 0? -->
  <polygon points="440,264 560,300 440,336 320,300" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="296" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">shadow_value</text>
  <text x="440" y="310" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">== 0 ?</text>

  <!-- Yes branch (safe) -->
  <path d="M560,300 L680,300" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#aGreen)"/>
  <rect x="620" y="275" width="30" height="16" rx="3" fill="white" fill-opacity="0.95"/>
  <text x="635" y="287" text-anchor="middle" font-size="9" font-weight="bold" fill="#16a34a">Yes</text>
  <rect x="690" y="282" width="160" height="36" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="770" y="304" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">✓ 安全，执行 load/store</text>

  <!-- No branch -->
  <path d="M440,336 L440,367" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#aRed)"/>
  <rect x="425" y="340" width="30" height="16" rx="3" fill="white" fill-opacity="0.95"/>
  <text x="440" y="352" text-anchor="middle" font-size="9" font-weight="bold" fill="#dc2626">No</text>

  <!-- Step 4: compute offset -->
  <rect x="280" y="370" width="320" height="44" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="440" y="388" text-anchor="middle" font-size="10" fill="#991b1b">计算 granule 内偏移</text>
  <text x="440" y="404" text-anchor="middle" font-size="9" font-family="monospace" fill="#991b1b">last_byte = (unsigned long)ptr &amp; 0x7</text>

  <path d="M440,414 L440,439" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#aFlow)"/>

  <!-- Decision 2: offset >= shadow? -->
  <polygon points="440,442 570,478 440,514 310,478" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="474" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">last_byte &gt;=</text>
  <text x="440" y="488" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">shadow_value ?</text>

  <!-- Yes → BUG -->
  <path d="M570,478 L680,478" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#aRed)"/>
  <rect x="620" y="462" width="30" height="16" rx="3" fill="white" fill-opacity="0.95"/>
  <text x="635" y="474" text-anchor="middle" font-size="9" font-weight="bold" fill="#dc2626">Yes</text>
  <rect x="690" y="458" width="170" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#sh2)"/>
  <text x="775" y="476" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">✗ 越界!</text>
  <text x="775" y="493" text-anchor="middle" font-size="9" fill="#991b1b">kasan_report() → BUG</text>

  <!-- No → safe -->
  <path d="M310,478 L200,478" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#aGreen)"/>
  <rect x="245" y="462" width="30" height="16" rx="3" fill="white" fill-opacity="0.95"/>
  <text x="260" y="474" text-anchor="middle" font-size="9" font-weight="bold" fill="#16a34a">No</text>
  <rect x="40" y="460" width="160" height="36" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="482" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">✓ 安全，执行 load/store</text>

  <!-- Explanation box -->
  <rect x="40" y="530" width="800" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="550" font-size="10" fill="#475569">关键洞察: shadow_value=N (1~7) 表示 granule 中前 N 字节可访问。若访问的字节偏移 &gt;= N，则超出合法范围。</text>
  <text x="60" y="568" font-size="10" fill="#475569">shadow_value 为负数 (0x80~0xFF) 时，整个 granule 不可访问 — 对应 redzone / freed / invalid 等毒化标记。</text>
</svg>
