<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2120 1780" font-family="'Segoe UI','Noto Sans SC',Arial,sans-serif">
  <defs>
    <filter id="sh">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.16"/>
    </filter>

    <linearGradient id="hdrBoot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="hdrFw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="hdrPlat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="hdrPmuv3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="hdrGeneric" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="hdrPerf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>

    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#334155" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <marker id="aB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#0369a1" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <marker id="aG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#15803d" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <marker id="aR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2120" height="1780" fill="#f8fafc"/>

  <text x="1060" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">ARM64 PMU 初始化 / 注册路径时序图</text>
  <text x="1060" y="66" text-anchor="middle" font-size="12" fill="#64748b">源文件：drivers/perf/arm_pmuv3.c · drivers/perf/arm_pmu_platform.c · drivers/perf/arm_pmu_acpi.c · drivers/perf/arm_pmu.c</text>

  <g transform="translate(42,94)">
    <rect width="500" height="100" rx="10" fill="#ffffff" fill-opacity="0.94" stroke="#cbd5e1" stroke-width="1.2" filter="url(#sh)"/>
    <text x="16" y="22" font-size="12" font-weight="700" fill="#0f172a">读图说明</text>
    <path d="M18,44 H110" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
    <text x="124" y="48" font-size="11" fill="#334155">主调用路径</text>
    <path d="M18,70 H110" fill="none" stroke="#0369a1" stroke-width="2.2" stroke-dasharray="6,3" marker-end="url(#aB)"/>
    <text x="124" y="74" font-size="11" fill="#334155">DT / ACPI 分支</text>
    <path d="M18,96 H110" fill="none" stroke="#15803d" stroke-width="2.2" stroke-dasharray="4,2" marker-end="url(#aG)"/>
    <text x="124" y="100" font-size="11" fill="#334155">能力探测 / 注册副作用</text>
  </g>

  <g transform="translate(80,220)">
    <rect width="220" height="58" rx="8" fill="#fff" stroke="#6d28d9" stroke-width="2" filter="url(#sh)"/>
    <rect width="220" height="30" rx="8" fill="url(#hdrBoot)"/>
    <rect x="0" y="22" width="220" height="8" fill="url(#hdrBoot)"/>
    <text x="110" y="20" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Kernel Init</text>
    <text x="110" y="47" text-anchor="middle" font-size="10" fill="#5b21b6">device_initcall()</text>
    <line x1="110" y1="278" x2="110" y2="1660" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <g transform="translate(380,220)">
    <rect width="220" height="58" rx="8" fill="#fff" stroke="#0369a1" stroke-width="2" filter="url(#sh)"/>
    <rect width="220" height="30" rx="8" fill="url(#hdrFw)"/>
    <rect x="0" y="22" width="220" height="8" fill="url(#hdrFw)"/>
    <text x="110" y="20" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">FW / Match</text>
    <text x="110" y="47" text-anchor="middle" font-size="10" fill="#075985">DT / ACPI entry</text>
    <line x1="110" y1="278" x2="110" y2="1660" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <g transform="translate(680,220)">
    <rect width="260" height="58" rx="8" fill="#fff" stroke="#0284c7" stroke-width="2" filter="url(#sh)"/>
    <rect width="260" height="30" rx="8" fill="url(#hdrPlat)"/>
    <rect x="0" y="22" width="260" height="8" fill="url(#hdrPlat)"/>
    <text x="130" y="20" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Platform / ACPI Glue</text>
    <text x="130" y="47" text-anchor="middle" font-size="10" fill="#0369a1">arm_pmu_platform.c / arm_pmu_acpi.c</text>
    <line x1="130" y1="278" x2="130" y2="1660" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <g transform="translate(1020,220)">
    <rect width="260" height="58" rx="8" fill="#fff" stroke="#15803d" stroke-width="2" filter="url(#sh)"/>
    <rect width="260" height="30" rx="8" fill="url(#hdrPmuv3)"/>
    <rect x="0" y="22" width="260" height="8" fill="url(#hdrPmuv3)"/>
    <text x="130" y="20" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">arm_pmuv3.c</text>
    <text x="130" y="47" text-anchor="middle" font-size="10" fill="#166534">PMUv3-specific init</text>
    <line x1="130" y1="278" x2="130" y2="1660" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <g transform="translate(1360,220)">
    <rect width="260" height="58" rx="8" fill="#fff" stroke="#b91c1c" stroke-width="2" filter="url(#sh)"/>
    <rect width="260" height="30" rx="8" fill="url(#hdrGeneric)"/>
    <rect x="0" y="22" width="260" height="8" fill="url(#hdrGeneric)"/>
    <text x="130" y="20" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">arm_pmu.c</text>
    <text x="130" y="47" text-anchor="middle" font-size="10" fill="#991b1b">generic ARM PMU glue</text>
    <line x1="130" y1="278" x2="130" y2="1660" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <g transform="translate(1700,220)">
    <rect width="280" height="58" rx="8" fill="#fff" stroke="#115e59" stroke-width="2" filter="url(#sh)"/>
    <rect width="280" height="30" rx="8" fill="url(#hdrPerf)"/>
    <rect x="0" y="22" width="280" height="8" fill="url(#hdrPerf)"/>
    <text x="140" y="20" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">perf core / sysfs / CPUHP</text>
    <text x="140" y="47" text-anchor="middle" font-size="10" fill="#134e4a">perf_pmu_register()</text>
    <line x1="140" y1="278" x2="140" y2="1660" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <g transform="translate(52,334)">
    <rect width="286" height="64" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4" filter="url(#sh)"/>
    <text x="18" y="24" font-size="11" font-weight="700" fill="#5b21b6">1. device_initcall(armv8_pmu_driver_init)</text>
    <text x="18" y="44" font-size="10" fill="#6d28d9">进入 ARMv8 PMUv3 驱动注册入口</text>
  </g>
  <path d="M300,366 H380" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>

  <g transform="translate(342,430)">
    <rect width="296" height="122" rx="8" fill="#eff6ff" stroke="#0284c7" stroke-width="1.5" filter="url(#sh)"/>
    <text x="18" y="24" font-size="11" font-weight="700" fill="#075985">2. 分支选择：DT 或 ACPI</text>
    <text x="18" y="44" font-size="10" fill="#0c4a6e">[DT] platform_driver_register(&amp;armv8_pmu_driver)</text>
    <text x="18" y="62" font-size="10" fill="#0c4a6e">[ACPI] arm_pmu_acpi_probe(armv8_pmuv3_pmu_init)</text>
    <text x="18" y="84" font-size="10" fill="#0c4a6e">两条路径最终都会构造 arm_pmu，并进入 register 阶段</text>
    <text x="18" y="102" font-size="10" fill="#0c4a6e">区别在于设备枚举和 CPU 绑定来源不同</text>
  </g>

  <path d="M600,468 H680" fill="none" stroke="#0369a1" stroke-width="2.2" stroke-dasharray="6,3" marker-end="url(#aB)"/>
  <g transform="translate(650,590)">
    <rect width="320" height="98" rx="8" fill="#ecfeff" stroke="#0284c7" stroke-width="1.5" filter="url(#sh)"/>
    <text x="18" y="24" font-size="11" font-weight="700" fill="#0369a1">3A. DT path: arm_pmu_device_probe()</text>
    <text x="18" y="44" font-size="10" fill="#0369a1">armv8_pmu_device_probe() → arm_pmu_device_probe()</text>
    <text x="18" y="62" font-size="10" fill="#0369a1">匹配 of_device_id，解析中断和 affinity</text>
    <text x="18" y="80" font-size="10" fill="#0369a1">随后分配 arm_pmu 并回调 init_fn</text>
  </g>

  <path d="M600,518 H760 V726" fill="none" stroke="#0369a1" stroke-width="2.2" stroke-dasharray="6,3" marker-end="url(#aB)"/>
  <g transform="translate(650,736)">
    <rect width="320" height="98" rx="8" fill="#eff6ff" stroke="#0284c7" stroke-width="1.5" filter="url(#sh)"/>
    <text x="18" y="24" font-size="11" font-weight="700" fill="#075985">3B. ACPI path: arm_pmu_acpi_probe()</text>
    <text x="18" y="44" font-size="10" fill="#0c4a6e">枚举 MADT/GICC，匹配 CPU 和 PMU instance</text>
    <text x="18" y="62" font-size="10" fill="#0c4a6e">arm_pmu_acpi_probe_matching_cpus()</text>
    <text x="18" y="80" font-size="10" fill="#0c4a6e">随后同样调用 armv8_pmuv3_pmu_init() 和 armpmu_register()</text>
  </g>

  <path d="M940,638 H1020" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M940,784 H1020" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>

  <g transform="translate(996,604)">
    <rect width="308" height="218" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#sh)"/>
    <text x="18" y="24" font-size="11" font-weight="700" fill="#166534">4. armv8_pmuv3_pmu_init() / armv8_pmu_init()</text>
    <text x="18" y="48" font-size="10" fill="#166534">先调用 armv8pmu_probe_pmu(cpu_pmu)</text>
    <text x="18" y="66" font-size="10" fill="#166534">通过 smp_call_function_any() 到目标 CPU 上执行</text>
    <text x="18" y="84" font-size="10" fill="#166534">__armv8pmu_probe_pmu():</text>
    <text x="36" y="102" font-size="10" fill="#166534">read_pmuver()</text>
    <text x="36" y="120" font-size="10" fill="#166534">PMCR.N → cntr_mask</text>
    <text x="36" y="138" font-size="10" fill="#166534">read_pmceid0/1() → 事件能力</text>
    <text x="36" y="156" font-size="10" fill="#166534">可选 brbe_probe()</text>
    <text x="18" y="180" font-size="10" fill="#166534">随后填充 handle_irq / enable / disable / map_event / get_event_idx 等回调</text>
    <text x="18" y="198" font-size="10" fill="#166534">这是“具体 PMUv3 能力注入 arm_pmu”的关键一步</text>
  </g>

  <path d="M1280,714 H1360" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <g transform="translate(1332,880)">
    <rect width="318" height="188" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" filter="url(#sh)"/>
    <text x="18" y="24" font-size="11" font-weight="700" fill="#991b1b">5. armpmu_alloc() + armpmu_register()</text>
    <text x="18" y="48" font-size="10" fill="#991b1b">kzalloc(struct arm_pmu)</text>
    <text x="18" y="66" font-size="10" fill="#991b1b">alloc_percpu(struct pmu_hw_events)</text>
    <text x="18" y="84" font-size="10" fill="#991b1b">填充 pmu.event_init / add / del / start / stop / read</text>
    <text x="18" y="102" font-size="10" fill="#991b1b">注册 IRQ: armpmu_request_irqs()</text>
    <text x="18" y="120" font-size="10" fill="#991b1b">request_irq() 或 request_nmi()</text>
    <text x="18" y="138" font-size="10" fill="#991b1b">cpu_pmu_init() 安装 CPU hotplug 回调</text>
    <text x="18" y="156" font-size="10" fill="#991b1b">最后把 pmu 交给 perf_pmu_register()</text>
  </g>

  <path d="M1620,972 H1700" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <g transform="translate(1672,888)">
    <rect width="340" height="258" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5" filter="url(#sh)"/>
    <text x="18" y="24" font-size="11" font-weight="700" fill="#134e4a">6. perf core / sysfs / CPUHP side effects</text>
    <text x="18" y="50" font-size="10" fill="#134e4a">perf_pmu_register(&amp;pmu-&gt;pmu, pmu-&gt;name, -1)</text>
    <text x="18" y="70" font-size="10" fill="#134e4a">加入 perf 全局 PMU 链表</text>
    <text x="18" y="90" font-size="10" fill="#134e4a">创建 /sys/bus/event_source/devices/&lt;name&gt;/</text>
    <text x="18" y="110" font-size="10" fill="#134e4a">暴露 format / events / caps / cpumask</text>
    <text x="18" y="138" font-size="10" fill="#134e4a">cpuhp_state_add_instance(CPUHP_AP_PERF_ARM_STARTING)</text>
    <text x="18" y="158" font-size="10" fill="#134e4a">后续 CPU online/offline 会经过 perf PMU hotplug 回调</text>
    <text x="18" y="186" font-size="10" fill="#134e4a">到这里，用户态 `perf list` 已能看到该 PMU</text>
    <text x="18" y="206" font-size="10" fill="#134e4a">但还没有任何 perf_event 被装上硬件 counter</text>
    <text x="18" y="226" font-size="10" fill="#134e4a">真正装载事件要等 perf_event_open() / armpmu_add()</text>
  </g>

  <path d="M110,430 V520 H1500 V880" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="682" y="507" width="256" height="22" rx="4" fill="white" fill-opacity="0.95"/>
  <text x="810" y="522" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">init_fn / alloc / request_irqs merge here</text>

  <path d="M1840,1146 V1240 H1100 V822" fill="none" stroke="#15803d" stroke-width="2.2" stroke-dasharray="4,2" marker-end="url(#aG)"/>
  <rect x="1318" y="1227" width="170" height="22" rx="4" fill="white" fill-opacity="0.95"/>
  <text x="1403" y="1242" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">registered PMU used later</text>

  <g transform="translate(82,1328)">
    <rect width="1950" height="290" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4" filter="url(#sh)"/>
    <text x="24" y="28" font-size="13" font-weight="700" fill="#0f172a">时序图想说明的 4 个关键边界</text>

    <rect x="20" y="50" width="450" height="96" rx="8" fill="#eff6ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="36" y="74" font-size="11" font-weight="700" fill="#0369a1">1. 初始化/注册 和 事件装载 是两回事</text>
    <text x="36" y="96" font-size="10" fill="#0369a1">这张图结束在 `perf_pmu_register()`，此时 PMU 只是“对 perf core 可见”。</text>
    <text x="36" y="114" font-size="10" fill="#0369a1">真正把事件下到硬件，要到后面的 `perf_event_open()` / `armpmu_add()`。</text>

    <rect x="494" y="50" width="450" height="96" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
    <text x="510" y="74" font-size="11" font-weight="700" fill="#166534">2. PMUv3 能力探测发生在注册之前</text>
    <text x="510" y="96" font-size="10" fill="#166534">必须先知道 `pmuver`、`cntr_mask`、`pmceid_bitmap`，才能决定后续 event_init / add 的行为。</text>

    <rect x="968" y="50" width="450" height="96" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="984" y="74" font-size="11" font-weight="700" fill="#991b1b">3. arm_pmu.c 是 generic glue，arm_pmuv3.c 是 hardware personality</text>
    <text x="984" y="96" font-size="10" fill="#991b1b">一个负责 perf 框架粘合、IRQ 和注册，一个负责 PMUv3 寄存器语义和硬件能力描述。</text>

    <rect x="1442" y="50" width="486" height="96" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/>
    <text x="1458" y="74" font-size="11" font-weight="700" fill="#134e4a">4. DT 和 ACPI 入口不同，但最终收敛到同一 PMU 抽象</text>
    <text x="1458" y="96" font-size="10" fill="#134e4a">无论设备来自设备树还是固件表，最后都要变成 `struct arm_pmu` 并交给 perf core。</text>

    <rect x="20" y="168" width="1908" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="36" y="194" font-size="11" font-weight="700" fill="#334155">建议和正文对照着读这几组函数</text>
    <text x="36" y="218" font-size="10" fill="#475569">`armv8_pmu_driver_init()` → `armv8_pmu_device_probe()` / `arm_pmu_acpi_probe()` → `arm_pmu_device_probe()` / `armv8_pmuv3_pmu_init()` → `armv8_pmu_init()` / `armv8pmu_probe_pmu()` → `armpmu_register()` → `perf_pmu_register()`</text>
  </g>

  <text x="1060" y="1726" text-anchor="middle" font-size="12" fill="#475569">一句话总结：初始化路径负责把 PMUv3 的硬件能力和回调函数封装成 `struct arm_pmu` 并注册到 perf core；只有这一步完成后，后续 `perf_event_open()` 才有目标 PMU 可以绑定。</text>
</svg>