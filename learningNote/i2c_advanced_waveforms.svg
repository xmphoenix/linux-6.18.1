<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080">
  <style>
    .title { font: 700 28px sans-serif; fill: #111827; }
    .subtitle { font: 700 20px sans-serif; fill: #1f2937; }
    .label { font: 16px sans-serif; fill: #374151; }
    .small { font: 14px sans-serif; fill: #4b5563; }
    .bus { fill: none; stroke: #111827; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    .sda { fill: none; stroke: #7c3aed; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    .scl2 { fill: none; stroke: #dc2626; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    .guide { fill: none; stroke: #d1d5db; stroke-width: 2; stroke-dasharray: 5 5; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 2; }
  </style>

  <rect x="0" y="0" width="1280" height="1080" fill="#f8fafc"/>
  <text x="40" y="50" class="title">I2C Advanced Waveforms</text>
  <text x="40" y="80" class="small">Detailed conceptual waveforms for 10-bit addressing, clock stretching, and arbitration.</text>

  <rect x="30" y="110" width="1220" height="270" rx="12" class="box"/>
  <text x="50" y="145" class="subtitle">1. 10-bit Address Transaction</text>
  <text x="60" y="190" class="label">Sequence</text>
  <text x="185" y="190" class="small">S  11110 A9 A8  W  ACK  A7..A0  ACK  Data  ACK  P</text>
  <text x="60" y="240" class="label">SCL</text>
  <text x="60" y="300" class="label">SDA</text>
  <polyline class="bus" points="130,225 165,225 165,285 205,285 205,225 245,225 245,285 285,285 285,225 325,225 325,285 365,285 365,225 405,225 405,285 445,285 445,225 485,225 485,285 525,285 525,225 565,225 565,285 605,285 605,225 645,225 645,285 685,285 685,225 725,225 725,285 765,285 765,225 805,225 805,285 845,285 845,225 885,225 885,285 925,285 925,225 965,225 965,285 1005,285 1005,225 1045,225 1045,285 1085,285 1085,225 1125,225"/>
  <polyline class="sda" points="130,290 150,290 165,330 370,330 390,290 470,290 490,330 770,330 790,290 950,290 970,330 1085,330 1105,290 1125,290"/>
  <text x="930" y="205" class="small">Two address bytes are mandatory in 10-bit mode</text>
  <text x="930" y="230" class="small">The first byte starts with 11110 and carries A9:A8</text>

  <rect x="30" y="410" width="1220" height="270" rx="12" class="box"/>
  <text x="50" y="445" class="subtitle">2. Clock Stretching</text>
  <text x="60" y="495" class="label">Master SCL intent</text>
  <text x="60" y="555" class="label">Actual bus SCL</text>
  <text x="60" y="615" class="label">SDA</text>
  <polyline class="guide" points="130,480 250,480 250,540 350,540 350,480 450,480 450,540 550,540 550,480 650,480 650,540 750,540 750,480 850,480"/>
  <polyline class="bus" points="130,540 250,540 250,600 430,600 430,540 530,540 530,600 630,600 630,540 730,540 730,600 830,600 830,540 850,540"/>
  <polyline class="sda" points="130,610 180,610 220,650 330,650 370,610 520,610 560,650 700,650 740,610 850,610"/>
  <text x="900" y="545" class="small">Slave holds SCL low here: the clock is stretched</text>
  <text x="900" y="570" class="small">Master must not advance data sampling until SCL is really high</text>

  <rect x="30" y="710" width="1220" height="320" rx="12" class="box"/>
  <text x="50" y="745" class="subtitle">3. Multi-master Arbitration</text>
  <text x="60" y="800" class="label">SCL</text>
  <text x="60" y="860" class="label">Master A SDA</text>
  <text x="60" y="920" class="label">Master B SDA</text>
  <text x="60" y="980" class="label">Observed bus SDA</text>
  <polyline class="bus" points="130,785 180,785 180,845 240,845 240,785 300,785 300,845 360,845 360,785 420,785 420,845 480,845 480,785 540,785 540,845 600,845 600,785 660,785 660,845 720,845 720,785 780,785 780,845 840,845 840,785 900,785"/>
  <polyline class="sda" points="130,850 180,850 210,890 360,890 390,850 540,850 570,890 720,890 750,850 900,850"/>
  <polyline class="scl2" points="130,910 180,910 240,910 270,950 420,950 480,950 510,910 660,910 720,910 750,950 900,950"/>
  <polyline class="bus" points="130,970 180,970 210,1010 420,1010 480,1010 510,970 720,970 780,970 810,1010 900,1010"/>
  <text x="945" y="900" class="small">If one master releases SDA high but another pulls it low, the bus is low</text>
  <text x="945" y="925" class="small">The master that expected a high level detects arbitration loss and backs off</text>
</svg>
