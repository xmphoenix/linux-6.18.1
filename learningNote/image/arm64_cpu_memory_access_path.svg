<svg viewBox="0 0 1320 930" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Noto Sans SC',Arial,sans-serif">
  <defs>
    <filter id="shMem"><feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.14"/></filter>
    <linearGradient id="hdrCpuMem" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="hdrTlbMem" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="hdrWalkMem" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <linearGradient id="hdrCtrlMem" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#94a3b8"/></linearGradient>
    <linearGradient id="hdrCacheMem" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d97706"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <linearGradient id="hdrDdrMem" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dc2626"/><stop offset="1" stop-color="#f87171"/></linearGradient>
    <marker id="aMem" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/></marker>
    <marker id="aMemHit" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round"/></marker>
    <marker id="aMemMiss" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round"/></marker>
    <marker id="aMemWalk" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#059669" stroke-width="1.5" stroke-linejoin="round"/></marker>
    <marker id="aMemCache" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round"/></marker>
  </defs>

  <rect x="20" y="20" width="1280" height="890" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="660" y="48" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">CPU 访问内存的硬件路径</text>
  <text x="660" y="70" text-anchor="middle" font-size="11" fill="#64748b">ARM64 EL1 普通内存访问示意: VA 先过 TLB, miss 时由硬件 page-table walker 遍历页表, 得到 PA 后再进入 cache hierarchy</text>
  <text x="660" y="87" text-anchor="middle" font-size="10" fill="#94a3b8">对应概念: TTBR0_EL1 / TTBR1_EL1, TCR_EL1, MAIR_EL1, PGD / PUD / PMD / PTE, L1 / L2 / LLC, DDR</text>

  <g transform="translate(55,105)">
    <rect width="250" height="122" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shMem)"/>
    <text x="20" y="24" font-size="13" font-weight="bold" fill="#334155">图例</text>
    <path d="M20,44 L95,44" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#aMemHit)"/>
    <text x="108" y="48" font-size="11" fill="#475569">TLB hit 快路径</text>
    <path d="M20,68 L95,68" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#aMemMiss)"/>
    <text x="108" y="72" font-size="11" fill="#475569">TLB miss / 需要翻页</text>
    <path d="M20,92 L95,92" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#aMemWalk)"/>
    <text x="108" y="96" font-size="11" fill="#475569">硬件页表遍历 / 回填</text>
    <path d="M20,116 L95,116" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#aMemCache)"/>
    <text x="108" y="120" font-size="11" fill="#475569">cache miss 继续向下一级</text>
  </g>

  <g transform="translate(370,110)">
    <rect width="300" height="92" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shMem)"/>
    <rect width="300" height="30" rx="10" fill="url(#hdrCpuMem)"/>
    <rect y="22" width="300" height="8" fill="#60a5fa"/>
    <text x="150" y="21" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">CPU Core</text>
    <text x="20" y="52" font-size="11" fill="#2563eb" font-weight="bold">load / store / instruction fetch</text>
    <text x="20" y="69" font-size="11" fill="#475569">先发出虚拟地址 VA，同时带着访问权限和访问类型</text>
    <text x="20" y="84" font-size="10" fill="#94a3b8">MMU 会先尝试在 TLB 中找到最近的 VA -&gt; PA 翻译结果</text>
  </g>

  <g transform="translate(370,250)">
    <rect width="300" height="176" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shMem)"/>
    <rect width="300" height="30" rx="10" fill="url(#hdrTlbMem)"/>
    <rect y="22" width="300" height="8" fill="#a78bfa"/>
    <text x="150" y="21" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">TLB (Translation Lookaside Buffer)</text>
    <text x="20" y="54" font-size="11" fill="#7c3aed" font-weight="bold">缓存最近使用的页表翻译</text>
    <text x="20" y="73" font-size="11" fill="#475569">命中时直接得到 PA、访问权限、可执行位、AttrIndx</text>
    <text x="20" y="92" font-size="11" fill="#475569">未命中时不陷入内核，而是由硬件 page-table walker 继续处理</text>
    <rect x="20" y="110" width="260" height="46" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="32" y="131" font-size="10" fill="#6d28d9">典型现象</text>
    <text x="32" y="146" font-size="10" fill="#6b7280">TLB hit 延迟很低；稳定工作集下命中率通常很高</text>
  </g>

  <g transform="translate(830,110)">
    <rect width="400" height="104" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2" filter="url(#shMem)"/>
    <rect width="400" height="30" rx="10" fill="url(#hdrCtrlMem)"/>
    <rect y="22" width="400" height="8" fill="#94a3b8"/>
    <text x="200" y="21" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">MMU 控制寄存器</text>
    <text x="20" y="56" font-size="11" fill="#334155"><tspan font-weight="bold">TTBR0_EL1 / TTBR1_EL1</tspan>: 指向用户态 / 内核态根页表</text>
    <text x="20" y="74" font-size="11" fill="#334155"><tspan font-weight="bold">TCR_EL1</tspan>: 决定 VA 位宽、granule size、shareability</text>
    <text x="20" y="92" font-size="11" fill="#334155"><tspan font-weight="bold">MAIR_EL1</tspan>: 给 AttrIndx 定义 Normal / Device 等内存属性</text>
  </g>

  <g transform="translate(830,250)">
    <rect width="400" height="136" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#shMem)"/>
    <rect width="400" height="30" rx="10" fill="url(#hdrWalkMem)"/>
    <rect y="22" width="400" height="8" fill="#34d399"/>
    <text x="200" y="21" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Hardware Page-Table Walker</text>
    <text x="20" y="56" font-size="11" fill="#059669" font-weight="bold">TLB miss 后硬件自动执行</text>
    <text x="20" y="75" font-size="11" fill="#475569">1. 根据当前异常级和 VA 选择 TTBR0/TTBR1 根表</text>
    <text x="20" y="94" font-size="11" fill="#475569">2. 按 PGD / PUD / PMD / PTE 逐级读取 descriptor</text>
    <text x="20" y="113" font-size="11" fill="#475569">3. 检查 AF / AP / UXN / PXN / AttrIndx，并把结果回填到 TLB</text>
  </g>

  <g transform="translate(830,450)">
    <rect width="400" height="172" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#shMem)"/>
    <rect width="400" height="30" rx="10" fill="url(#hdrWalkMem)"/>
    <rect y="22" width="400" height="8" fill="#34d399"/>
    <text x="200" y="21" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Page Tables in RAM</text>
    <text x="20" y="54" font-size="11" fill="#475569">这些 descriptor 本身也驻留在普通内存中，因此 walker 访问页表时也会走 cache / DDR</text>
    <rect x="20" y="74" width="78" height="42" rx="8" fill="#ecfeff" stroke="#67e8f9"/>
    <rect x="116" y="74" width="78" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="212" y="74" width="78" height="42" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <rect x="308" y="74" width="72" height="42" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="59" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#155e75">PGD</text>
    <text x="155" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">PUD</text>
    <text x="251" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">PMD</text>
    <text x="344" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">PTE</text>
    <path d="M98,95 L116,95" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#aMem)"/>
    <path d="M194,95 L212,95" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#aMem)"/>
    <path d="M290,95 L308,95" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#aMem)"/>
    <text x="20" y="138" font-size="10" fill="#64748b">最后一级 PTE 提供物理页号、权限位和 cacheability / shareability 属性</text>
    <text x="20" y="154" font-size="10" fill="#94a3b8">若 descriptor 无效或权限不满足，则会触发 translation fault / permission fault</text>
  </g>

  <g transform="translate(370,470)">
    <rect width="300" height="88" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shMem)"/>
    <rect width="300" height="30" rx="10" fill="url(#hdrCpuMem)"/>
    <rect y="22" width="300" height="8" fill="#60a5fa"/>
    <text x="150" y="21" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">PA + Memory Attributes</text>
    <text x="20" y="54" font-size="11" fill="#475569">完成翻译后，CPU 得到物理地址、访问权限和内存类型</text>
    <text x="20" y="72" font-size="10" fill="#94a3b8">Normal memory 通常进入 cache；Device memory 可以被标记为不可缓存</text>
  </g>

  <g transform="translate(300,635)">
    <rect width="470" height="218" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2" filter="url(#shMem)"/>
    <rect width="470" height="30" rx="10" fill="url(#hdrCacheMem)"/>
    <rect y="22" width="470" height="8" fill="#fbbf24"/>
    <text x="235" y="21" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Cache Hierarchy</text>
    <rect x="26" y="54" width="418" height="42" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <rect x="26" y="108" width="418" height="42" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <rect x="26" y="162" width="418" height="42" rx="8" fill="#fefce8" stroke="#fde68a"/>
    <text x="48" y="79" font-size="12" font-weight="bold" fill="#9a3412">L1 D-Cache</text>
    <text x="170" y="79" font-size="10" fill="#6b7280">离核心最近，常见 line size 为 64B</text>
    <text x="48" y="133" font-size="12" font-weight="bold" fill="#92400e">L2 Cache</text>
    <text x="170" y="133" font-size="10" fill="#6b7280">L1 miss 后继续查找，更大但更慢</text>
    <text x="48" y="187" font-size="12" font-weight="bold" fill="#854d0e">LLC / DSU / SLC</text>
    <text x="170" y="187" font-size="10" fill="#6b7280">某些 SoC 提供共享末级 cache，再 miss 才去 DDR</text>
  </g>

  <g transform="translate(885,670)">
    <rect width="300" height="126" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2" filter="url(#shMem)"/>
    <rect width="300" height="30" rx="10" fill="url(#hdrDdrMem)"/>
    <rect y="22" width="300" height="8" fill="#f87171"/>
    <text x="150" y="21" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Physical Memory (DDR / LPDDR)</text>
    <text x="20" y="58" font-size="11" fill="#475569">所有 cache 都 miss 后，最终访问外部 DRAM</text>
    <text x="20" y="76" font-size="11" fill="#475569">内存控制器按物理地址把对应 cache line 取回</text>
    <text x="20" y="94" font-size="10" fill="#94a3b8">延迟最高，但容量最大；返回数据后会上行回填各级 cache</text>
  </g>

  <path d="M520,202 L520,250" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#aMem)"/>
  <rect x="540" y="213" width="78" height="24" rx="4" fill="#ffffff" fill-opacity="0.95"/>
  <text x="579" y="229" text-anchor="middle" font-size="10" fill="#475569">VA request</text>

  <path d="M520,426 L520,470" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#aMemHit)"/>
  <rect x="545" y="435" width="112" height="24" rx="4" fill="#ffffff" fill-opacity="0.95"/>
  <text x="601" y="451" text-anchor="middle" font-size="10" fill="#2563eb">TLB hit: VA -&gt; PA</text>

  <path d="M670,330 L750,330 L750,318 L830,318" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#aMemMiss)"/>
  <rect x="690" y="290" width="100" height="24" rx="4" fill="#ffffff" fill-opacity="0.95"/>
  <text x="740" y="306" text-anchor="middle" font-size="10" fill="#dc2626">TLB miss</text>

  <path d="M1030,214 L1030,250" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#aMemWalk)"/>
  <rect x="1050" y="220" width="96" height="24" rx="4" fill="#ffffff" fill-opacity="0.95"/>
  <text x="1098" y="236" text-anchor="middle" font-size="10" fill="#059669">控制翻译规则</text>

  <path d="M1030,386 L1030,450" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#aMemWalk)"/>
  <rect x="1052" y="402" width="110" height="24" rx="4" fill="#ffffff" fill-opacity="0.95"/>
  <text x="1107" y="418" text-anchor="middle" font-size="10" fill="#059669">读取页表项</text>

  <path d="M830,535 L748,535 L748,365 L670,365" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#aMemWalk)"/>
  <rect x="700" y="505" width="118" height="24" rx="4" fill="#ffffff" fill-opacity="0.95"/>
  <text x="759" y="521" text-anchor="middle" font-size="10" fill="#059669">回填 TLB 结果</text>

  <path d="M520,558 L520,635" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#aMem)"/>
  <rect x="544" y="583" width="98" height="24" rx="4" fill="#ffffff" fill-opacity="0.95"/>
  <text x="593" y="599" text-anchor="middle" font-size="10" fill="#475569">PA + Attr</text>

  <path d="M770,744 L830,744 L830,733 L885,733" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#aMemCache)"/>
  <rect x="790" y="708" width="112" height="24" rx="4" fill="#ffffff" fill-opacity="0.95"/>
  <text x="846" y="724" text-anchor="middle" font-size="10" fill="#d97706">cache miss 下钻</text>

  <path d="M885,770 L820,770 L820,820 L770,820" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#aMem)"/>
  <rect x="792" y="786" width="122" height="24" rx="4" fill="#ffffff" fill-opacity="0.95"/>
  <text x="853" y="802" text-anchor="middle" font-size="10" fill="#475569">回填 64B cache line</text>

  <rect x="55" y="860" width="1170" height="28" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="74" y="878" font-size="10" fill="#64748b">要点: TLB 解决的是地址翻译缓存，Cache 解决的是数据缓存；二者命中与否相互独立。Device memory 可以绕过 cache，但地址翻译仍然遵循 MMU 规则。</text>
</svg>