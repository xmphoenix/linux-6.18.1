<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" font-family="'Segoe UI','Noto Sans SC',Arial,sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.12"/></filter>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#34495e" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="500" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">EEVDF 调度算法核心流程 (Linux 6.18 fair.c)</text>
  <text x="500" y="46" text-anchor="middle" font-size="10" fill="#7f8c8d">Earliest Eligible Virtual Deadline First — __pick_eevdf() 增广红黑树搜索</text>

  <!-- Step 1 -->
  <g transform="translate(30,70)">
    <rect width="280" height="160" rx="8" fill="#fff" stroke="#3498db" stroke-width="2" filter="url(#sh)"/>
    <rect width="280" height="28" rx="8" fill="#3498db"/>
    <rect x="0" y="20" width="280" height="8" fill="#2980b9"/>
    <text x="140" y="19" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">① update_curr() — vruntime 更新</text>
    <text x="15" y="48" font-size="9" fill="#555">delta_exec = now - curr-&gt;exec_start</text>
    <text x="15" y="66" font-size="9" fill="#2980b9" font-weight="bold">vruntime += delta × 1024 / weight</text>
    <text x="15" y="86" font-size="9" fill="#555">nice 0: weight=1024 → vruntime += delta×1</text>
    <text x="15" y="101" font-size="9" fill="#555">nice -5: weight=3121 → vruntime += delta×0.33</text>
    <text x="15" y="116" font-size="9" fill="#555">nice +5: weight=335  → vruntime += delta×3.06</text>
    <text x="15" y="136" font-size="9" fill="#e74c3c" font-weight="bold">效果: 高权重任务 vruntime 增长慢</text>
    <text x="15" y="151" font-size="9" fill="#e74c3c" font-weight="bold">→ 在树中位置靠左 → 更多被选中</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(360,70)">
    <rect width="280" height="160" rx="8" fill="#fff" stroke="#e67e22" stroke-width="2" filter="url(#sh)"/>
    <rect width="280" height="28" rx="8" fill="#e67e22"/>
    <rect x="0" y="20" width="280" height="8" fill="#d35400"/>
    <text x="140" y="19" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">② update_deadline() — 截止时间</text>
    <text x="15" y="48" font-size="9" fill="#555">当 vruntime &gt;= deadline 时更新:</text>
    <text x="15" y="66" font-size="9" fill="#d35400" font-weight="bold">deadline = vruntime + slice×1024/weight</text>
    <text x="15" y="86" font-size="9" fill="#555">slice = sysctl_sched_base_slice (默认700μs)</text>
    <text x="15" y="106" font-size="9" fill="#555">nice 0:  deadline = vruntime + 700μs</text>
    <text x="15" y="121" font-size="9" fill="#555">nice -5: deadline = vruntime + 229μs (更近!)</text>
    <text x="15" y="136" font-size="9" fill="#555">nice +5: deadline = vruntime + 2140μs</text>
    <text x="15" y="151" font-size="9" fill="#e74c3c" font-weight="bold">短slice → 近deadline → 优先调度</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(690,70)">
    <rect width="280" height="160" rx="8" fill="#fff" stroke="#27ae60" stroke-width="2" filter="url(#sh)"/>
    <rect width="280" height="28" rx="8" fill="#27ae60"/>
    <rect x="0" y="20" width="280" height="8" fill="#1e8449"/>
    <text x="140" y="19" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">③ entity_eligible() — 合格判定</text>
    <text x="15" y="48" font-size="9" fill="#555">V = avg_vruntime(cfs_rq)</text>
    <text x="15" y="63" font-size="9" fill="#555">  = Σ(v_i × w_i) / Σ(w_i)</text>
    <text x="15" y="83" font-size="9" fill="#1e8449" font-weight="bold">eligible ⟺ V ≥ v_i (即 lag ≥ 0)</text>
    <text x="15" y="103" font-size="9" fill="#555">lag = V - v_i = 应得服务 - 实际服务</text>
    <text x="15" y="123" font-size="9" fill="#555">lag &gt; 0: 被欠服务 → 合格</text>
    <text x="15" y="138" font-size="9" fill="#555">lag &lt; 0: 超前获得服务 → 不合格</text>
    <text x="15" y="153" font-size="9" fill="#e74c3c" font-weight="bold">不合格实体不参与选择!</text>
  </g>

  <!-- Arrows -->
  <path d="M310,150 L360,150" fill="none" stroke="#34495e" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M640,150 L690,150" fill="none" stroke="#34495e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Main algorithm -->
  <g transform="translate(30,270)">
    <rect width="940" height="290" rx="10" fill="#fafcff" stroke="#2c3e50" stroke-width="2" filter="url(#sh)"/>
    <rect width="940" height="30" rx="10" fill="#2c3e50"/>
    <rect x="0" y="22" width="940" height="8" fill="#1a252f"/>
    <text x="470" y="21" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">④ __pick_eevdf(cfs_rq) — 增广红黑树搜索 (fair.c:944)</text>

    <!-- Tree nodes -->
    <circle cx="460" cy="75" r="18" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
    <text x="460" y="71" text-anchor="middle" font-size="8" fill="#2c3e50">D=50</text>
    <text x="460" y="81" text-anchor="middle" font-size="7" fill="#27ae60">V=45✓</text>
    <text x="460" y="97" font-size="7" fill="#7f8c8d" text-anchor="middle">min_v=30</text>

    <circle cx="290" cy="140" r="18" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
    <text x="290" y="136" text-anchor="middle" font-size="8" fill="#e74c3c">D=35</text>
    <text x="290" y="146" text-anchor="middle" font-size="7" fill="#27ae60">V=30✓</text>
    <text x="290" y="162" font-size="7" fill="#7f8c8d" text-anchor="middle">min_v=30</text>

    <circle cx="630" cy="140" r="18" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
    <text x="630" y="136" text-anchor="middle" font-size="8" fill="#2c3e50">D=70</text>
    <text x="630" y="146" text-anchor="middle" font-size="7" fill="#e74c3c">V=55✗</text>
    <text x="630" y="162" font-size="7" fill="#7f8c8d" text-anchor="middle">min_v=55</text>

    <circle cx="190" cy="205" r="18" fill="#d5f5e3" stroke="#27ae60" stroke-width="3"/>
    <text x="190" y="201" text-anchor="middle" font-size="8" fill="#27ae60" font-weight="bold">D=30</text>
    <text x="190" y="211" text-anchor="middle" font-size="7" fill="#27ae60">V=32✓</text>
    <text x="190" y="226" font-size="7" fill="#27ae60" font-weight="bold" text-anchor="middle">★ PICK!</text>

    <circle cx="380" cy="205" r="18" fill="#fff" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="380" y="201" text-anchor="middle" font-size="8" fill="#2c3e50">D=42</text>
    <text x="380" y="211" text-anchor="middle" font-size="7" fill="#27ae60">V=38✓</text>

    <!-- Edges -->
    <line x1="447" y1="90" x2="303" y2="125" stroke="#34495e" stroke-width="1.5"/>
    <line x1="473" y1="90" x2="617" y2="125" stroke="#34495e" stroke-width="1.5"/>
    <line x1="277" y1="155" x2="203" y2="190" stroke="#27ae60" stroke-width="2.5"/>
    <line x1="303" y1="155" x2="367" y2="190" stroke="#34495e" stroke-width="1.5"/>

    <!-- Algorithm text -->
    <rect x="20" y="240" width="900" height="35" rx="5" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
    <text x="30" y="256" font-size="9" fill="#2c3e50" font-weight="bold">搜索步骤:</text>
    <text x="100" y="256" font-size="9" fill="#555">1. leftmost eligible → 直接返回 (O(1)) | 2. 左子树 min_vruntime ≤ V → 递归左 | 3. 当前 eligible → 返回 | 4. 否则右</text>
    <text x="30" y="270" font-size="9" fill="#7f8c8d">复杂度: 最坏 O(log n)，最好 O(1) (leftmost 合格时) | D=virtual deadline, V=vruntime, ✓=eligible, ✗=not eligible</text>

    <!-- Legend -->
    <g transform="translate(710,50)">
      <rect width="210" height="75" rx="4" fill="white" fill-opacity="0.95" stroke="#ddd" stroke-width="1"/>
      <text x="10" y="15" font-size="9" font-weight="bold" fill="#2c3e50">节点说明</text>
      <circle cx="20" cy="32" r="8" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
      <text x="35" y="36" font-size="8" fill="#555">eligible + 最早deadline = 选中</text>
      <circle cx="20" cy="52" r="8" fill="#fff" stroke="#2c3e50" stroke-width="1.5"/>
      <text x="35" y="56" font-size="8" fill="#555">eligible 但非最优</text>
      <circle cx="20" cy="68" r="8" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
      <text x="35" y="72" font-size="8" fill="#555">NOT eligible (红色边框)</text>
    </g>
  </g>

  <!-- Bottom properties -->
  <g transform="translate(30,580)">
    <rect width="940" height="150" rx="8" fill="#fff" stroke="#8e44ad" stroke-width="1.5" filter="url(#sh)"/>
    <text x="20" y="22" font-size="11" font-weight="bold" fill="#8e44ad">EEVDF 核心保证与参数</text>
    <line x1="20" y1="30" x2="920" y2="30" stroke="#e8d0f0" stroke-width="0.8"/>
    <text x="20" y="50" font-size="9" fill="#2c3e50" font-weight="bold">延迟上界:</text>
    <text x="100" y="50" font-size="9" fill="#555">任务从就绪到运行的最大等待 ≤ O(Σ slice_i) — 有理论证明的有限延迟</text>
    <text x="20" y="70" font-size="9" fill="#2c3e50" font-weight="bold">公平性:</text>
    <text x="100" y="70" font-size="9" fill="#555">长期运行中, 任务获得 CPU 时间 ∝ weight (所有 vruntime 趋同)</text>
    <text x="20" y="90" font-size="9" fill="#2c3e50" font-weight="bold">短任务优先:</text>
    <text x="100" y="90" font-size="9" fill="#555">slice 小 → deadline 近 → 自然优先调度 (无需CFS的buddy启发式)</text>
    <text x="20" y="115" font-size="9" fill="#2c3e50" font-weight="bold">关键参数:</text>
    <text x="100" y="115" font-size="9" fill="#555">sysctl_sched_base_slice = 700000ns (0.7ms) → /sys/kernel/debug/sched/base_slice_ns</text>
    <text x="100" y="130" font-size="9" fill="#555">减小 → 低延迟+高切换开销 | 增大 → 高吞吐+延迟增加</text>
    <text x="100" y="145" font-size="9" fill="#555">SCHED_FEAT: PLACE_LAG=true, RUN_TO_PARITY=true, PREEMPT_SHORT=true, DELAY_DEQUEUE=true</text>
  </g>
</svg>
