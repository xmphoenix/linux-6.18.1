<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="'Segoe UI','Noto Sans SC',Arial,sans-serif">
  <defs>
    <filter id="sh3"><feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/></filter>
    <marker id="aDown" markerWidth="10" markerHeight="7" refX="3.5" refY="9" orient="auto">
      <path d="M1,1 L3.5,9 L6,1" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <marker id="aRight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Slab 对象生命周期与 KASAN Shadow 染色</text>
  <text x="450" y="46" text-anchor="middle" font-size="10" fill="#64748b">源码: mm/kasan/common.c — __kasan_slab_alloc() / __kasan_slab_free()</text>

  <!-- Phase 1: Slab page init -->
  <g transform="translate(30,65)">
    <rect width="840" height="120" rx="8" fill="#fff" stroke="#6366f1" stroke-width="2" filter="url(#sh3)"/>
    <text x="20" y="22" font-size="12" font-weight="bold" fill="#4338ca">阶段 1: Slab 页初始化 (__kasan_poison_slab)</text>

    <!-- Memory layout -->
    <text x="20" y="50" font-size="10" fill="#475569">内存布局:</text>
    <rect x="100" y="38" width="720" height="30" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
    <text x="460" y="57" text-anchor="middle" font-size="10" font-family="monospace" fill="#991b1b">整页全部标记为 KASAN_SLAB_REDZONE (0xFC)</text>

    <!-- Shadow -->
    <text x="20" y="90" font-size="10" fill="#475569">Shadow:</text>
    <rect x="100" y="78" width="720" height="24" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="460" y="95" text-anchor="middle" font-size="9" font-family="monospace" fill="#dc2626">FC FC FC FC FC FC FC FC FC FC FC FC FC FC FC FC FC FC FC FC FC FC ...</text>
  </g>

  <!-- Phase 2: Object allocated -->
  <g transform="translate(30,210)">
    <rect width="840" height="140" rx="8" fill="#fff" stroke="#16a34a" stroke-width="2" filter="url(#sh3)"/>
    <text x="20" y="22" font-size="12" font-weight="bold" fill="#166534">阶段 2: 对象分配 (__kasan_slab_alloc → unpoison_slab_object)</text>
    <text x="20" y="40" font-size="9" fill="#64748b">假设 kmalloc(20) → 实际 object_size=32, 对齐到 KASAN_GRANULE=8B</text>

    <!-- Memory layout -->
    <text x="20" y="64" font-size="10" fill="#475569">内存:</text>
    <rect x="100" y="52" width="80" height="30" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
    <text x="140" y="71" text-anchor="middle" font-size="8" font-family="monospace" fill="#991b1b">Redzone(L)</text>
    <rect x="180" y="52" width="200" height="30" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="280" y="71" text-anchor="middle" font-size="9" font-family="monospace" fill="#166534">Object Body (20B 可用 + 12B padding)</text>
    <rect x="380" y="52" width="80" height="30" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
    <text x="420" y="71" text-anchor="middle" font-size="8" font-family="monospace" fill="#991b1b">Redzone(R)</text>
    <rect x="460" y="52" width="320" height="30" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
    <text x="620" y="71" text-anchor="middle" font-size="9" font-family="monospace" fill="#991b1b">下一个对象的空间 (REDZONE)</text>

    <!-- Shadow -->
    <text x="20" y="108" font-size="10" fill="#475569">Shadow:</text>
    <rect x="100" y="96" width="40" height="24" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="120" y="112" text-anchor="middle" font-size="9" font-family="monospace" fill="#dc2626">FC</text>
    <rect x="140" y="96" width="40" height="24" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="160" y="112" text-anchor="middle" font-size="9" font-family="monospace" fill="#166534">00</text>
    <rect x="180" y="96" width="40" height="24" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="200" y="112" text-anchor="middle" font-size="9" font-family="monospace" fill="#166534">00</text>
    <rect x="220" y="96" width="40" height="24" rx="3" fill="#fef9c3" stroke="#eab308" stroke-width="1"/>
    <text x="240" y="112" text-anchor="middle" font-size="9" font-family="monospace" fill="#a16207">04</text>
    <rect x="260" y="96" width="40" height="24" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="280" y="112" text-anchor="middle" font-size="9" font-family="monospace" fill="#dc2626">FC</text>
    <rect x="300" y="96" width="40" height="24" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="320" y="112" text-anchor="middle" font-size="9" font-family="monospace" fill="#dc2626">FC</text>
    <rect x="340" y="96" width="40" height="24" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="360" y="112" text-anchor="middle" font-size="9" font-family="monospace" fill="#dc2626">FC</text>
    <rect x="380" y="96" width="40" height="24" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="400" y="112" text-anchor="middle" font-size="9" font-family="monospace" fill="#dc2626">FC</text>
    <text x="440" y="112" font-size="9" fill="#64748b">...</text>

    <text x="100" y="132" font-size="9" fill="#64748b">↑ 8B  ↑ 8B  ↑ 8B  ↑ 4B可用  ↑ redzone ...</text>
    <text x="500" y="108" font-size="9" fill="#a16207">← shadow=4 表示此 granule 仅前 4 字节可访问 (20 mod 8 = 4)</text>
  </g>

  <!-- Phase 3: Object freed -->
  <g transform="translate(30,375)">
    <rect width="840" height="120" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2" filter="url(#sh3)"/>
    <text x="20" y="22" font-size="12" font-weight="bold" fill="#991b1b">阶段 3: 对象释放 (poison_slab_object → quarantine)</text>

    <!-- Memory layout -->
    <text x="20" y="50" font-size="10" fill="#475569">内存:</text>
    <rect x="100" y="38" width="80" height="30" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
    <text x="140" y="57" text-anchor="middle" font-size="8" font-family="monospace" fill="#991b1b">Redzone(L)</text>
    <rect x="180" y="38" width="200" height="30" rx="3" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="280" y="57" text-anchor="middle" font-size="9" font-family="monospace" fill="#92400e">已释放 (quarantine 中, 含 free_meta)</text>
    <rect x="380" y="38" width="80" height="30" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
    <text x="420" y="57" text-anchor="middle" font-size="8" font-family="monospace" fill="#991b1b">Redzone(R)</text>

    <!-- Shadow -->
    <text x="20" y="90" font-size="10" fill="#475569">Shadow:</text>
    <rect x="100" y="78" width="40" height="24" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="120" y="95" text-anchor="middle" font-size="9" font-family="monospace" fill="#dc2626">FC</text>
    <rect x="140" y="78" width="40" height="24" rx="3" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
    <text x="160" y="95" text-anchor="middle" font-size="9" font-family="monospace" fill="#92400e">FB</text>
    <rect x="180" y="78" width="40" height="24" rx="3" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
    <text x="200" y="95" text-anchor="middle" font-size="9" font-family="monospace" fill="#92400e">FB</text>
    <rect x="220" y="78" width="40" height="24" rx="3" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
    <text x="240" y="95" text-anchor="middle" font-size="9" font-family="monospace" fill="#92400e">FB</text>
    <rect x="260" y="78" width="40" height="24" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="280" y="95" text-anchor="middle" font-size="9" font-family="monospace" fill="#dc2626">FC</text>
    <text x="320" y="95" font-size="9" fill="#64748b">...</text>

    <text x="420" y="95" font-size="9" fill="#92400e">← FB = KASAN_SLAB_FREE (任何访问触发 UAF 报告)</text>
  </g>

  <!-- Phase 4: Quarantine eviction -->
  <g transform="translate(30,520)">
    <rect width="840" height="110" rx="8" fill="#fff" stroke="#6366f1" stroke-width="2" filter="url(#sh3)"/>
    <text x="20" y="22" font-size="12" font-weight="bold" fill="#4338ca">阶段 4: Quarantine 驱逐 → 归还 SLUB freelist</text>
    <text x="20" y="40" font-size="9" fill="#64748b">对象从隔离区移除后，shadow 保留 FB 标记直到被重新分配覆盖</text>

    <!-- Memory layout -->
    <text x="20" y="64" font-size="10" fill="#475569">内存:</text>
    <rect x="100" y="52" width="360" height="30" rx="3" fill="#e0e7ff" stroke="#818cf8" stroke-width="1"/>
    <text x="280" y="71" text-anchor="middle" font-size="9" font-family="monospace" fill="#4338ca">对象回到 freelist，等待下次 kmalloc 分配</text>

    <!-- Shadow -->
    <text x="20" y="98" font-size="10" fill="#475569">Shadow:</text>
    <text x="100" y="98" font-size="9" fill="#64748b">保持 FB 状态 → 直到 __kasan_slab_alloc() 重新 unpoison</text>
  </g>

  <!-- Arrows between phases -->
  <path d="M450,185 L450,210" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#aRight)" transform="rotate(90,450,197)"/>
  <path d="M450,350 L450,375" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#aRight)" transform="rotate(90,450,362)"/>
  <path d="M450,495 L450,520" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#aRight)" transform="rotate(90,450,507)"/>

  <!-- Legend -->
  <g transform="translate(580,630)">
    <rect width="280" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="10" y="8" width="16" height="12" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="32" y="18" font-size="9" fill="#475569">可访问</text>
    <rect x="80" y="8" width="16" height="12" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="102" y="18" font-size="9" fill="#475569">Redzone</text>
    <rect x="155" y="8" width="16" height="12" rx="2" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
    <text x="177" y="18" font-size="9" fill="#475569">已释放</text>
    <rect x="225" y="8" width="16" height="12" rx="2" fill="#fef9c3" stroke="#eab308" stroke-width="1"/>
    <text x="247" y="18" font-size="9" fill="#475569">部分可用</text>
  </g>
</svg>
