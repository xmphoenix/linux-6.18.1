<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1480" font-family="'Segoe UI','Noto Sans SC',Arial,sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <!-- 各 initcall 级别渐变 -->
    <linearGradient id="hdrPure" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="hdrCore" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#f87171"/></linearGradient>
    <linearGradient id="hdrSubsys" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="hdrFs" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#34d399"/></linearGradient>
    <linearGradient id="hdrLate" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#fbbf24"/></linearGradient>
    <linearGradient id="hdrTitle" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#334155"/></linearGradient>
    <!-- 箭头 -->
    <marker id="arrDown" markerWidth="10" markerHeight="10" refX="5" refY="10" orient="auto">
      <path d="M0,0 L5,10 L10,0" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <marker id="arrRight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1360" height="1480" rx="12" fill="#f8fafc"/>

  <!-- 标题 -->
  <text x="680" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">eBPF 子系统内核启动初始化流程</text>
  <text x="680" y="60" text-anchor="middle" font-size="12" fill="#64748b">Linux 6.18.1 — kernel/bpf/ &amp; net/core/ &amp; arch/arm64/net/</text>

  <!-- ==================== 时间轴左侧标注 ==================== -->
  <line x1="80" y1="90" x2="80" y2="1420" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="76" y="85" text-anchor="end" font-size="11" fill="#64748b" font-weight="bold">内核启动顺序 ▼</text>

  <!-- ==================== Level 0: pure_initcall ==================== -->
  <g transform="translate(100,95)">
    <rect width="1220" height="100" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="2" filter="url(#sh)"/>
    <rect width="1220" height="32" rx="8" fill="url(#hdrPure)"/>
    <rect y="22" width="1220" height="10" fill="#7c3aed"/>
    <text x="15" y="22" font-size="14" font-weight="bold" fill="#fff">Level 0 — pure_initcall (最早)</text>
    <text x="1205" y="22" text-anchor="end" font-size="11" fill="#e9d5ff">系统启动最先执行</text>

    <!-- bpf_jit_charge_init -->
    <rect x="15" y="42" width="360" height="48" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="25" y="60" font-size="12" font-weight="bold" fill="#7c3aed">① bpf_jit_charge_init()</text>
    <text x="25" y="78" font-size="10" fill="#6b7280">core.c:1018 — 计算 JIT 可执行内存上限</text>

    <text x="400" y="60" font-size="10" fill="#4b5563">• bpf_jit_limit_max = MODULES_END - MODULES_VADDR (ARM64)</text>
    <text x="400" y="78" font-size="10" fill="#4b5563">• bpf_jit_limit = min(limit_max/2, LONG_MAX) — 所有 JIT 编译依赖此限额</text>
  </g>

  <!-- 箭头 Level 0 → Level 1 -->
  <line x1="80" y1="200" x2="80" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#arrDown)"/>

  <!-- ==================== Level 1: core_initcall ==================== -->
  <g transform="translate(100,230)">
    <rect width="1220" height="120" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2" filter="url(#sh)"/>
    <rect width="1220" height="32" rx="8" fill="url(#hdrCore)"/>
    <rect y="22" width="1220" height="10" fill="#dc2626"/>
    <text x="15" y="22" font-size="14" font-weight="bold" fill="#fff">Level 1 — core_initcall</text>
    <text x="1205" y="22" text-anchor="end" font-size="11" fill="#fecaca">基础设施就绪</text>

    <!-- cgroup_bpf_wq_init -->
    <rect x="15" y="42" width="520" height="68" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="25" y="60" font-size="12" font-weight="bold" fill="#dc2626">② cgroup_bpf_wq_init()</text>
    <text x="25" y="78" font-size="10" fill="#6b7280">cgroup.c:35 — 创建 cgroup BPF 专用工作队列</text>
    <text x="25" y="96" font-size="10" fill="#4b5563">alloc_workqueue("cgroup_bpf_destroy", WQ_PERCPU, 1)</text>

    <!-- bpf_offload_init -->
    <rect x="560" y="42" width="520" height="68" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="570" y="60" font-size="12" font-weight="bold" fill="#dc2626">③ bpf_offload_init()</text>
    <text x="570" y="78" font-size="10" fill="#6b7280">offload.c:873 — 初始化硬件卸载设备哈希表</text>
    <text x="570" y="96" font-size="10" fill="#4b5563">rhashtable_init(&amp;offdevs, &amp;offdevs_params)</text>
  </g>

  <!-- 箭头 Level 1 → Level 4 -->
  <line x1="80" y1="355" x2="80" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#arrDown)"/>

  <!-- ==================== Level 4: subsys_initcall ==================== -->
  <g transform="translate(100,385)">
    <rect width="1220" height="140" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
    <rect width="1220" height="32" rx="8" fill="url(#hdrSubsys)"/>
    <rect y="22" width="1220" height="10" fill="#2563eb"/>
    <text x="15" y="22" font-size="14" font-weight="bold" fill="#fff">Level 4 — subsys_initcall</text>
    <text x="1205" y="22" text-anchor="end" font-size="11" fill="#bfdbfe">子系统注册</text>

    <!-- btf_vmlinux_init -->
    <rect x="15" y="42" width="380" height="88" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="25" y="60" font-size="12" font-weight="bold" fill="#2563eb">④ btf_vmlinux_init()</text>
    <text x="25" y="78" font-size="10" fill="#6b7280">sysfs_btf.c:54 — 暴露 vmlinux BTF</text>
    <text x="25" y="94" font-size="10" fill="#4b5563">→ /sys/kernel/btf/vmlinux</text>
    <text x="25" y="110" font-size="10" fill="#4b5563">libbpf / bpftool 依赖此接口</text>

    <!-- dev_map_init -->
    <rect x="420" y="42" width="380" height="88" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="430" y="60" font-size="12" font-weight="bold" fill="#2563eb">⑤ dev_map_init()</text>
    <text x="430" y="78" font-size="10" fill="#6b7280">devmap.c:1160 — XDP devmap 通知器</text>
    <text x="430" y="94" font-size="10" fill="#4b5563">register_netdevice_notifier()</text>
    <text x="430" y="110" font-size="10" fill="#4b5563">响应网卡增删事件</text>

    <!-- netns_bpf_init + bpf_lwt_init -->
    <rect x="825" y="42" width="380" height="88" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="835" y="60" font-size="12" font-weight="bold" fill="#2563eb">⑥⑦ 网络子系统 BPF</text>
    <text x="835" y="78" font-size="10" fill="#6b7280">net_namespace.c:560 — per-netns BPF</text>
    <text x="835" y="94" font-size="10" fill="#6b7280">lwt_bpf.c:657 — LWT BPF 封装</text>
    <text x="835" y="110" font-size="10" fill="#4b5563">pernet_subsys + lwtunnel_encap_ops</text>
  </g>

  <!-- 箭头 Level 4 → Level 5 -->
  <line x1="80" y1="530" x2="80" y2="555" stroke="#64748b" stroke-width="2" marker-end="url(#arrDown)"/>

  <!-- ==================== Level 5: fs_initcall ==================== -->
  <g transform="translate(100,560)">
    <rect width="1220" height="120" rx="8" fill="#fff" stroke="#059669" stroke-width="2" filter="url(#sh)"/>
    <rect width="1220" height="32" rx="8" fill="url(#hdrFs)"/>
    <rect y="22" width="1220" height="10" fill="#059669"/>
    <text x="15" y="22" font-size="14" font-weight="bold" fill="#fff">Level 5 — fs_initcall</text>
    <text x="1205" y="22" text-anchor="end" font-size="11" fill="#a7f3d0">文件系统注册</text>

    <!-- bpf_init -->
    <rect x="15" y="42" width="520" height="68" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="25" y="60" font-size="12" font-weight="bold" fill="#059669">⑧ bpf_init()</text>
    <text x="25" y="78" font-size="10" fill="#6b7280">inode.c:1096 — 注册 bpffs 虚拟文件系统</text>
    <text x="25" y="96" font-size="10" fill="#4b5563">sysfs_create_mount_point() + register_filesystem() → /sys/fs/bpf</text>

    <!-- btf_module_init -->
    <rect x="560" y="42" width="520" height="68" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="570" y="60" font-size="12" font-weight="bold" fill="#059669">⑨ btf_module_init()</text>
    <text x="570" y="78" font-size="10" fill="#6b7280">btf.c:8285 — 模块 BTF 通知器</text>
    <text x="570" y="96" font-size="10" fill="#4b5563">register_module_notifier() — 跟踪模块加载/卸载的 BTF</text>
  </g>

  <!-- 箭头 Level 5 → Level 7 -->
  <line x1="80" y1="685" x2="80" y2="710" stroke="#64748b" stroke-width="2" marker-end="url(#arrDown)"/>

  <!-- ==================== Level 7: late_initcall ==================== -->
  <g transform="translate(100,715)">
    <rect width="1220" height="700" rx="8" fill="#fff" stroke="#d97706" stroke-width="2" filter="url(#sh)"/>
    <rect width="1220" height="32" rx="8" fill="url(#hdrLate)"/>
    <rect y="22" width="1220" height="10" fill="#d97706"/>
    <text x="15" y="22" font-size="14" font-weight="bold" fill="#fff">Level 7 — late_initcall (大量初始化)</text>
    <text x="1205" y="22" text-anchor="end" font-size="11" fill="#fef3c7">BPF 子系统主体就绪</text>

    <!-- 核心子系统组 -->
    <text x="15" y="52" font-size="12" font-weight="bold" fill="#92400e">核心子系统</text>

    <rect x="15" y="60" width="280" height="72" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="25" y="78" font-size="11" font-weight="bold" fill="#d97706">⑩ bpf_global_ma_init()</text>
    <text x="25" y="94" font-size="10" fill="#6b7280">core.c:3218</text>
    <text x="25" y="110" font-size="10" fill="#4b5563">全局 BPF 内存分配器</text>

    <rect x="315" y="60" width="280" height="72" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="325" y="78" font-size="11" font-weight="bold" fill="#d97706">⑪ init_trampolines()</text>
    <text x="325" y="94" font-size="10" fill="#6b7280">trampoline.c:1126</text>
    <text x="325" y="110" font-size="10" fill="#4b5563">fentry/fexit 蹦床哈希表</text>

    <rect x="615" y="60" width="280" height="72" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="625" y="78" font-size="11" font-weight="bold" fill="#d97706">⑫ unbound_reg_init()</text>
    <text x="625" y="94" font-size="10" fill="#6b7280">verifier.c:18802</text>
    <text x="625" y="110" font-size="10" fill="#4b5563">验证器寄存器模板</text>

    <rect x="915" y="60" width="280" height="72" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="925" y="78" font-size="11" font-weight="bold" fill="#d97706">⑬ bpf_syscall_sysctl_init()</text>
    <text x="925" y="94" font-size="10" fill="#6b7280">syscall.c:6507</text>
    <text x="925" y="110" font-size="10" fill="#4b5563">注册 bpf_stats sysctl</text>

    <!-- 迭代器注册组 -->
    <text x="15" y="156" font-size="12" font-weight="bold" fill="#92400e">迭代器注册 (BPF Iterator)</text>

    <rect x="15" y="164" width="180" height="55" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
    <text x="25" y="182" font-size="10" font-weight="bold" fill="#a16207">⑭ bpf_map_iter_init</text>
    <text x="25" y="198" font-size="9" fill="#6b7280">map_iter.c:182</text>

    <rect x="210" y="164" width="180" height="55" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
    <text x="220" y="182" font-size="10" font-weight="bold" fill="#a16207">⑮ bpf_prog_iter_init</text>
    <text x="220" y="198" font-size="9" fill="#6b7280">prog_iter.c:100</text>

    <rect x="405" y="164" width="180" height="55" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
    <text x="415" y="182" font-size="10" font-weight="bold" fill="#a16207">⑯ bpf_link_iter_init</text>
    <text x="415" y="198" font-size="9" fill="#6b7280">link_iter.c:100</text>

    <rect x="600" y="164" width="180" height="55" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
    <text x="610" y="182" font-size="10" font-weight="bold" fill="#a16207">⑰ task_iter_init</text>
    <text x="610" y="198" font-size="9" fill="#6b7280">task_iter.c:1044</text>

    <rect x="795" y="164" width="180" height="55" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
    <text x="805" y="182" font-size="10" font-weight="bold" fill="#a16207">⑱ cgroup_iter_init</text>
    <text x="805" y="198" font-size="9" fill="#6b7280">cgroup_iter.c:290</text>

    <rect x="990" y="164" width="190" height="55" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
    <text x="1000" y="182" font-size="10" font-weight="bold" fill="#a16207">⑲ kmem_cache_iter...</text>
    <text x="1000" y="198" font-size="9" fill="#6b7280">kmem_cache_iter.c:232</text>

    <!-- kfunc 注册组 -->
    <text x="15" y="244" font-size="12" font-weight="bold" fill="#92400e">kfunc 注册 (BPF 可调用内核函数)</text>

    <rect x="15" y="252" width="230" height="55" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
    <text x="25" y="270" font-size="10" font-weight="bold" fill="#ea580c">⑳ kfunc_init (helpers)</text>
    <text x="25" y="286" font-size="9" fill="#6b7280">helpers.c:4393 — 通用 kfunc</text>

    <rect x="260" y="252" width="230" height="55" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
    <text x="270" y="270" font-size="10" font-weight="bold" fill="#ea580c">㉑ cpumask_kfunc_init</text>
    <text x="270" y="286" font-size="9" fill="#6b7280">cpumask.c:520 — cpumask</text>

    <rect x="505" y="252" width="230" height="55" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
    <text x="515" y="270" font-size="10" font-weight="bold" fill="#ea580c">㉒ kfunc_init (arena)</text>
    <text x="515" y="286" font-size="9" fill="#6b7280">arena.c:631 — arena kfunc</text>

    <rect x="750" y="252" width="230" height="55" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
    <text x="760" y="270" font-size="10" font-weight="bold" fill="#ea580c">㉓ crypto_kfunc_init</text>
    <text x="760" y="286" font-size="9" fill="#6b7280">crypto.c:373 — 加密 kfunc</text>

    <rect x="995" y="252" width="195" height="55" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
    <text x="1005" y="270" font-size="10" font-weight="bold" fill="#ea580c">㉔ rqspinlock kfuncs</text>
    <text x="1005" y="286" font-size="9" fill="#6b7280">rqspinlock.c:756</text>

    <!-- 网络 BPF 初始化组 -->
    <text x="15" y="332" font-size="12" font-weight="bold" fill="#92400e">网络 BPF 初始化</text>

    <rect x="15" y="340" width="280" height="72" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="25" y="358" font-size="10" font-weight="bold" fill="#dc2626">㉕ bpf_kfunc_init (filter)</text>
    <text x="25" y="374" font-size="9" fill="#6b7280">net/core/filter.c:12389</text>
    <text x="25" y="390" font-size="9" fill="#4b5563">skb/xdp/sock kfunc 注册</text>

    <rect x="315" y="340" width="280" height="72" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="325" y="358" font-size="10" font-weight="bold" fill="#dc2626">㉖ bpf_sockmap_iter_init</text>
    <text x="325" y="374" font-size="9" fill="#6b7280">net/core/sock_map.c:1953</text>
    <text x="325" y="390" font-size="9" fill="#4b5563">sockmap 迭代器</text>

    <rect x="615" y="340" width="280" height="72" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="625" y="358" font-size="10" font-weight="bold" fill="#dc2626">㉗ bpf_tcp_ca_kfunc_init</text>
    <text x="625" y="374" font-size="9" fill="#6b7280">net/ipv4/bpf_tcp_ca.c:340</text>
    <text x="625" y="390" font-size="9" fill="#4b5563">TCP CC struct_ops + kfunc</text>

    <rect x="915" y="340" width="280" height="72" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="925" y="358" font-size="10" font-weight="bold" fill="#dc2626">㉘ tcp/udp_bpf_build_proto</text>
    <text x="925" y="374" font-size="9" fill="#6b7280">tcp_bpf.c / udp_bpf.c</text>
    <text x="925" y="390" font-size="9" fill="#4b5563">sockmap 协议变体构建</text>

    <!-- 预加载组 -->
    <text x="15" y="440" font-size="12" font-weight="bold" fill="#92400e">预加载</text>

    <rect x="15" y="448" width="360" height="55" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="25" y="466" font-size="10" font-weight="bold" fill="#7c3aed">㉙ load() — BPF preload</text>
    <text x="25" y="482" font-size="9" fill="#6b7280">preload/bpf_preload_kern.c:78 — 嵌入式 BPF skeleton 加载</text>

    <!-- 运行时按需 -->
    <text x="15" y="530" font-size="12" font-weight="bold" fill="#92400e">运行时按需（无 initcall）</text>

    <rect x="15" y="538" width="280" height="55" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="25" y="556" font-size="10" font-weight="bold" fill="#475569">ARM64 JIT 编译</text>
    <text x="25" y="572" font-size="9" fill="#6b7280">bpf_int_jit_compile() — 按需触发</text>

    <rect x="315" y="538" width="280" height="55" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="325" y="556" font-size="10" font-weight="bold" fill="#475569">BPF Token</text>
    <text x="325" y="572" font-size="9" fill="#6b7280">BPF_TOKEN_CREATE syscall</text>

    <rect x="615" y="538" width="280" height="55" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="625" y="556" font-size="10" font-weight="bold" fill="#475569">BPF 程序加载 &amp; 验证</text>
    <text x="625" y="572" font-size="9" fill="#6b7280">bpf(BPF_PROG_LOAD) → 验证 → JIT</text>

    <!-- 分隔线 -->
    <line x1="15" y1="522" x2="1205" y2="522" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,2"/>

    <!-- 完成标记 -->
    <rect x="915" y="610" width="280" height="55" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="1055" y="634" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">✓ eBPF 子系统就绪</text>
    <text x="1055" y="650" text-anchor="middle" font-size="10" fill="#4b5563">可接受 bpf(2) 系统调用</text>
  </g>

  <!-- ==================== 图例 ==================== -->
  <g transform="translate(100,1420)">
    <rect width="1220" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="15" y="18" font-size="11" font-weight="bold" fill="#1e293b">图例:</text>
    <rect x="60" y="6" width="60" height="16" rx="3" fill="url(#hdrPure)"/><text x="130" y="18" font-size="10" fill="#4b5563">pure (0)</text>
