<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2080 1700" font-family="'Segoe UI','Noto Sans SC',Arial,sans-serif">
  <defs>
    <filter id="sh">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.16"/>
    </filter>

    <linearGradient id="hdrA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="hdrB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="hdrC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="hdrE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="hdrF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>

    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#334155" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <marker id="aRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <marker id="aGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#15803d" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2080" height="1700" fill="#f8fafc"/>
  <text x="1040" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">ARM64 PMU 采样中断路径时序图</text>
  <text x="1040" y="66" text-anchor="middle" font-size="12" fill="#64748b">主路径：PMU 计数器溢出 → GIC/IRQ → armpmu_dispatch_irq() → armv8pmu_handle_irq() → perf_event_overflow() → perf_buffer</text>

  <g transform="translate(36,92)">
    <rect width="430" height="100" rx="10" fill="#ffffff" fill-opacity="0.94" stroke="#cbd5e1" stroke-width="1.2" filter="url(#sh)"/>
    <text x="16" y="22" font-size="12" font-weight="700" fill="#0f172a">读图说明</text>
    <path d="M18,44 H106" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
    <text x="120" y="48" font-size="11" fill="#334155">同步调用 / 数据流转</text>
    <path d="M18,70 H106" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="6,3" marker-end="url(#aRed)"/>
    <text x="120" y="74" font-size="11" fill="#334155">硬件异常 / 中断路由</text>
    <path d="M18,96 H106" fill="none" stroke="#15803d" stroke-width="2.2" stroke-dasharray="4,2" marker-end="url(#aGreen)"/>
    <text x="120" y="100" font-size="11" fill="#334155">状态更新 / 重装周期</text>
  </g>

  <g transform="translate(80,220)">
    <rect width="220" height="58" rx="8" fill="#fff" stroke="#c2410c" stroke-width="2" filter="url(#sh)"/>
    <rect width="220" height="30" rx="8" fill="url(#hdrA)"/>
    <rect x="0" y="22" width="220" height="8" fill="url(#hdrA)"/>
    <text x="110" y="20" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">PMU Counters</text>
    <text x="110" y="47" text-anchor="middle" font-size="10" fill="#9a3412">PMEVCNTRn / PMCCNTR_EL0</text>
    <line x1="110" y1="278" x2="110" y2="1580" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <g transform="translate(380,220)">
    <rect width="220" height="58" rx="8" fill="#fff" stroke="#0369a1" stroke-width="2" filter="url(#sh)"/>
    <rect width="220" height="30" rx="8" fill="url(#hdrB)"/>
    <rect x="0" y="22" width="220" height="8" fill="url(#hdrB)"/>
    <text x="110" y="20" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">GIC / IRQ</text>
    <text x="110" y="47" text-anchor="middle" font-size="10" fill="#075985">PPI / SPI routing</text>
    <line x1="110" y1="278" x2="110" y2="1580" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <g transform="translate(680,220)">
    <rect width="240" height="58" rx="8" fill="#fff" stroke="#15803d" stroke-width="2" filter="url(#sh)"/>
    <rect width="240" height="30" rx="8" fill="url(#hdrC)"/>
    <rect x="0" y="22" width="240" height="8" fill="url(#hdrC)"/>
    <text x="120" y="20" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">arm_pmu.c</text>
    <text x="120" y="47" text-anchor="middle" font-size="10" fill="#166534">armpmu_dispatch_irq()</text>
    <line x1="120" y1="278" x2="120" y2="1580" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <g transform="translate(1020,220)">
    <rect width="260" height="58" rx="8" fill="#fff" stroke="#b91c1c" stroke-width="2" filter="url(#sh)"/>
    <rect width="260" height="30" rx="8" fill="url(#hdrD)"/>
    <rect x="0" y="22" width="260" height="8" fill="url(#hdrD)"/>
    <text x="130" y="20" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">arm_pmuv3.c</text>
    <text x="130" y="47" text-anchor="middle" font-size="10" fill="#991b1b">armv8pmu_handle_irq()</text>
    <line x1="130" y1="278" x2="130" y2="1580" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <g transform="translate(1380,220)">
    <rect width="260" height="58" rx="8" fill="#fff" stroke="#6d28d9" stroke-width="2" filter="url(#sh)"/>
    <rect width="260" height="30" rx="8" fill="url(#hdrE)"/>
    <rect x="0" y="22" width="260" height="8" fill="url(#hdrE)"/>
    <text x="130" y="20" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">perf core</text>
    <text x="130" y="47" text-anchor="middle" font-size="10" fill="#5b21b6">perf_event_overflow()</text>
    <line x1="130" y1="278" x2="130" y2="1580" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <g transform="translate(1740,220)">
    <rect width="220" height="58" rx="8" fill="#fff" stroke="#115e59" stroke-width="2" filter="url(#sh)"/>
    <rect width="220" height="30" rx="8" fill="url(#hdrF)"/>
    <rect x="0" y="22" width="220" height="8" fill="url(#hdrF)"/>
    <text x="110" y="20" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">perf_buffer</text>
    <text x="110" y="47" text-anchor="middle" font-size="10" fill="#134e4a">ring buffer / mmap page</text>
    <line x1="110" y1="278" x2="110" y2="1580" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <g transform="translate(42,330)">
    <rect width="260" height="58" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" filter="url(#sh)"/>
    <text x="18" y="24" font-size="11" font-weight="700" fill="#9a3412">1. Counter overflow</text>
    <text x="18" y="42" font-size="10" fill="#7c2d12">计数器从负载初值递增到溢出点</text>
  </g>
  <path d="M302,359 H380" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="6,3" marker-end="url(#aRed)"/>

  <g transform="translate(342,430)">
    <rect width="296" height="64" rx="8" fill="#eff6ff" stroke="#0284c7" stroke-width="1.6" filter="url(#sh)"/>
    <text x="18" y="24" font-size="11" font-weight="700" fill="#075985">2. GIC routes PMI</text>
    <text x="18" y="42" font-size="10" fill="#0c4a6e">PPI/SPI 送到目标 CPU，对应 request_irq()/request_nmi()</text>
  </g>
  <path d="M600,462 H680" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>

  <g transform="translate(642,530)">
    <rect width="316" height="78" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" filter="url(#sh)"/>
    <text x="18" y="24" font-size="11" font-weight="700" fill="#166534">3. armpmu_dispatch_irq()</text>
    <text x="18" y="42" font-size="10" fill="#166534">读取 percpu arm_pmu 指针</text>
    <text x="18" y="58" font-size="10" fill="#166534">统一转发到 pmu-&gt;handle_irq(pmu)</text>
  </g>
  <path d="M920,569 H1020" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>

  <g transform="translate(986,650)">
    <rect width="330" height="86" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" filter="url(#sh)"/>
    <text x="18" y="24" font-size="11" font-weight="700" fill="#991b1b">4. armv8pmu_getreset_flags()</text>
    <text x="18" y="42" font-size="10" fill="#991b1b">读取 PMOVSCLR_EL0 溢出位图</text>
    <text x="18" y="58" font-size="10" fill="#991b1b">同时清除已触发的 overflow flags</text>
    <text x="18" y="74" font-size="10" fill="#991b1b">避免重复进入同一个中断源</text>
  </g>

  <path d="M1150,736 V790" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <g transform="translate(986,806)">
    <rect width="330" height="76" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" filter="url(#sh)"/>
    <text x="18" y="24" font-size="11" font-weight="700" fill="#991b1b">5. armv8pmu_stop()</text>
    <text x="18" y="42" font-size="10" fill="#991b1b">临时关闭 PMU，冻结计数器状态</text>
    <text x="18" y="58" font-size="10" fill="#991b1b">防止处理期间继续累加导致采样偏差</text>
  </g>

  <path d="M1150,882 V938" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <g transform="translate(930,956)">
    <rect width="442" height="132" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" filter="url(#sh)"/>
    <text x="18" y="24" font-size="11" font-weight="700" fill="#991b1b">6. 遍历所有溢出计数器</text>
    <text x="18" y="44" font-size="10" fill="#991b1b">for_each_set_bit(idx, cntr_mask)</text>
    <text x="18" y="62" font-size="10" fill="#991b1b">if counter_has_overflowed(pmovsr, idx):</text>
    <text x="36" y="80" font-size="10" fill="#991b1b">a. 找到 hw_events-&gt;events[idx] 对应 perf_event</text>
    <text x="36" y="98" font-size="10" fill="#991b1b">b. 取 event-&gt;hw.prev_count / period_left / sample_period</text>
    <text x="36" y="116" font-size="10" fill="#991b1b">c. 进入更新与重装周期路径</text>
  </g>

  <path d="M1150,1088 V1140" fill="none" stroke="#15803d" stroke-width="2.2" stroke-dasharray="4,2" marker-end="url(#aGreen)"/>
  <g transform="translate(930,1158)">
    <rect width="442" height="116" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6" filter="url(#sh)"/>
    <text x="18" y="24" font-size="11" font-weight="700" fill="#166534">7. armpmu_event_update()</text>
    <text x="18" y="44" font-size="10" fill="#166534">读取当前硬件计数值，计算 delta = new_raw - prev_raw</text>
    <text x="18" y="62" font-size="10" fill="#166534">累加到 event-&gt;count，并同步 period_left</text>
    <text x="18" y="80" font-size="10" fill="#166534">这是软件视角下的“真实样本消耗量”</text>
    <text x="18" y="98" font-size="10" fill="#166534">核心对象：perf_event + hw_perf_event</text>
  </g>

  <path d="M1150,1274 V1324" fill="none" stroke="#15803d" stroke-width="2.2" stroke-dasharray="4,2" marker-end="url(#aGreen)"/>
  <g transform="translate(930,1342)">
    <rect width="442" height="116" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6" filter="url(#sh)"/>
    <text x="18" y="24" font-size="11" font-weight="700" fill="#166534">8. armpmu_event_set_period()</text>
    <text x="18" y="44" font-size="10" fill="#166534">根据 period_left 计算新的负载初值</text>
    <text x="18" y="62" font-size="10" fill="#166534">write_counter((-left) &amp; max_period)</text>
    <text x="18" y="80" font-size="10" fill="#166534">为下一次采样窗口重装 PMU 计数器</text>
    <text x="18" y="98" font-size="10" fill="#166534">如果事件被 throttle，也在此处体现调度策略</text>
  </g>

  <path d="M1280,1400 H1380" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <g transform="translate(1380,1370)">
    <rect width="300" height="98" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6" filter="url(#sh)"/>
    <text x="18" y="24" font-size="11" font-weight="700" fill="#5b21b6">9. perf_event_overflow()</text>
    <text x="18" y="44" font-size="10" fill="#5b21b6">构造 perf_sample_data</text>
    <text x="18" y="62" font-size="10" fill="#5b21b6">检查 overflow_handler / throttle / sigtrap</text>
    <text x="18" y="80" font-size="10" fill="#5b21b6">决定是否写样本、是否停止事件</text>
  </g>

  <path d="M1640,1418 H1740" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <g transform="translate(1718,1370)">
    <rect width="286" height="98" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/>
    <text x="18" y="24" font-size="11" font-weight="700" fill="#134e4a">10. perf_output_* / perf_buffer</text>
    <text x="18" y="44" font-size="10" fill="#134e4a">把 sample record 写入 ring buffer</text>
    <text x="18" y="62" font-size="10" fill="#134e4a">更新 data_head / wakeup 计数</text>
    <text x="18" y="80" font-size="10" fill="#134e4a">用户态 perf record 从 mmap 区读取</text>
  </g>

  <path d="M1150,1458 V1510" fill="none" stroke="#15803d" stroke-width="2.2" stroke-dasharray="4,2" marker-end="url(#aGreen)"/>
  <g transform="translate(986,1526)">
    <rect width="330" height="74" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" filter="url(#sh)"/>
    <text x="18" y="24" font-size="11" font-weight="700" fill="#991b1b">11. armv8pmu_start()</text>
    <text x="18" y="42" font-size="10" fill="#991b1b">重新打开 PMU，继续下一轮采样</text>
    <text x="18" y="58" font-size="10" fill="#991b1b">本次 IRQ 处理完成，返回 IRQ_HANDLED</text>
  </g>

  <text x="1040" y="1650" text-anchor="middle" font-size="12" fill="#475569">关键理解：IRQ 路径的本质不是“直接把硬件计数写给用户态”，而是先在 arm_pmu/arm_pmuv3 中完成溢出确认、delta 计算和周期重装，再由 perf core 统一形成 sample 并写入 perf_buffer。</text>
</svg>