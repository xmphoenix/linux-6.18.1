<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1080" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="shadow-sm" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <filter id="shadow-md" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-pink" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#db2777"/>
    </marker>
    <marker id="arrow-blue" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#2563eb"/>
    </marker>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="1080" fill="#f5f3ff" rx="6"/>

  <!-- Title area -->
  <rect x="0" y="0" width="1280" height="56" fill="url(#header-grad)"/>
  <text x="640" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#e0e7ff">Buddy Allocator — 初始化完成后数据结构全景</text>
  <text x="640" y="44" text-anchor="middle" font-size="11" fill="#a5b4fc">memblock_free_all() + setup_per_cpu_pageset() 之后 · ARM64 · ZONE_DMA 1 GB · 4 CPUs</text>

  <!-- ==================== Top: struct zone overview ==================== -->
  <rect x="30" y="72" width="1220" height="90" rx="10" fill="#fff" filter="url(#shadow-md)"/>
  <rect x="30" y="72" width="1220" height="32" rx="10" fill="#4338ca"/>
  <rect x="30" y="88" width="1220" height="16" fill="#4338ca"/>
  <text x="50" y="92" font-size="13" font-weight="700" fill="#fff">struct zone</text>

  <!-- zone field cards -->
  <rect x="48" y="112" width="160" height="40" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="60" y="128" font-size="10" font-weight="600" fill="#7c3aed">lock</text>
  <text x="60" y="143" font-size="9" fill="#a78bfa">spinlock_t</text>

  <rect x="222" y="112" width="160" height="40" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="234" y="128" font-size="10" font-weight="600" fill="#d97706">managed_pages</text>
  <text x="234" y="143" font-size="9" fill="#f59e0b">262,144 页 (1 GB)</text>

  <rect x="396" y="112" width="160" height="40" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="408" y="128" font-size="10" font-weight="600" fill="#d97706">spanned_pages</text>
  <text x="408" y="143" font-size="9" fill="#f59e0b">262,144+</text>

  <rect x="570" y="112" width="200" height="40" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="582" y="128" font-size="10" font-weight="600" fill="#059669">free_area[0..10]</text>
  <text x="582" y="143" font-size="9" fill="#6ee7b7">struct free_area × 11</text>

  <rect x="784" y="112" width="220" height="40" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="796" y="128" font-size="10" font-weight="600" fill="#2563eb">per_cpu_pageset</text>
  <text x="796" y="143" font-size="9" fill="#93c5fd">per_cpu_pages __percpu *</text>

  <rect x="1018" y="112" width="215" height="40" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="1030" y="128" font-size="10" font-weight="600" fill="#2563eb">per_cpu_zonestats</text>
  <text x="1030" y="143" font-size="9" fill="#93c5fd">per_cpu_zonestat __percpu *</text>

  <!-- Connector arrows -->
  <line x1="670" y1="152" x2="670" y2="190" stroke="#db2777" stroke-width="1.5" marker-end="url(#arrow-pink)" stroke-dasharray="5,3"/>
  <line x1="894" y1="152" x2="894" y2="810" stroke="#db2777" stroke-width="1.5" marker-end="url(#arrow-pink)" stroke-dasharray="5,3"/>
  <line x1="1125" y1="152" x2="1125" y2="810" stroke="#db2777" stroke-width="1.5" marker-end="url(#arrow-pink)" stroke-dasharray="5,3"/>

  <!-- ==================== Middle: free_area[] array ==================== -->
  <rect x="30" y="196" width="1220" height="604" rx="10" fill="#fff" filter="url(#shadow-md)"/>
  <rect x="30" y="196" width="1220" height="36" rx="10" fill="#0f172a"/>
  <rect x="30" y="220" width="1220" height="12" fill="#0f172a"/>
  <text x="50" y="219" font-size="13" font-weight="700" fill="#e2e8f0">free_area[] — Buddy 核心空闲链表</text>

  <!-- Column headers for migrate types -->
  <text x="770" y="250" font-size="9" font-weight="600" fill="#94a3b8">free_list</text>
  <text x="840" y="250" font-size="9" font-weight="600" fill="#94a3b8">[0] UNMOVABLE</text>
  <text x="938" y="250" font-size="9" font-weight="600" fill="#94a3b8">[1] MOVABLE</text>
  <text x="1036" y="250" font-size="9" font-weight="600" fill="#94a3b8">[2] RECLAIM</text>
  <text x="1116" y="250" font-size="9" font-weight="600" fill="#94a3b8">[3] CMA</text>
  <text x="1188" y="250" font-size="9" font-weight="600" fill="#94a3b8">[4] HIATOM</text>

  <!-- free_area row template: order N -->
  <!-- order=0 -->
  <rect x="48" y="260" width="1184" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="64" y="284" font-size="11" font-weight="700" fill="#475569">order 0</text>
  <text x="136" y="284" font-size="10" fill="#94a3b8">4 KB × 1 = 4 KB</text>
  <!-- UNMOVABLE -->
  <rect x="826" y="267" width="96" height="28" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="836" y="284" font-size="9" fill="#cbd5e1">∅</text>
  <!-- MOVABLE - populated -->
  <rect x="928" y="267" width="96" height="28" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="938" y="284" font-size="9" fill="#059669">●──●──●</text>
  <!-- RECLAIM -->
  <rect x="1030" y="267" width="74" height="28" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1038" y="284" font-size="9" fill="#cbd5e1">∅</text>
  <!-- CMA -->
  <rect x="1110" y="267" width="48" height="28" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1116" y="284" font-size="9" fill="#cbd5e1">∅</text>
  <!-- HIATOM -->
  <rect x="1164" y="267" width="48" height="28" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1170" y="284" font-size="9" fill="#cbd5e1">∅</text>
  <text x="748" y="284" font-size="8" fill="#94a3b8">(order≤3→PCP)</text>

  <!-- order=1 -->
  <rect x="48" y="308" width="1184" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="64" y="332" font-size="11" font-weight="700" fill="#475569">order 1</text>
  <text x="136" y="332" font-size="10" fill="#94a3b8">4 KB × 2 = 8 KB</text>
  <rect x="826" y="315" width="96" height="28" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="836" y="332" font-size="9" fill="#cbd5e1">∅</text>
  <rect x="928" y="315" width="96" height="28" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="938" y="332" font-size="9" fill="#059669">●──●──●</text>
  <rect x="1030" y="315" width="74" height="28" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1038" y="332" font-size="9" fill="#cbd5e1">∅</text>
  <rect x="1110" y="315" width="48" height="28" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1116" y="332" font-size="9" fill="#cbd5e1">∅</text>
  <rect x="1164" y="315" width="48" height="28" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1170" y="332" font-size="9" fill="#cbd5e1">∅</text>

  <!-- order=2 -->
  <rect x="48" y="356" width="1184" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="64" y="380" font-size="11" font-weight="700" fill="#475569">order 2</text>
  <text x="136" y="380" font-size="10" fill="#94a3b8">4 KB × 4 = 16 KB</text>
  <rect x="826" y="363" width="96" height="28" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="836" y="380" font-size="9" fill="#cbd5e1">∅</text>
  <rect x="928" y="363" width="96" height="28" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="938" y="380" font-size="9" fill="#059669">●──●──●</text>
  <rect x="1030" y="363" width="74" height="28" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1038" y="380" font-size="9" fill="#cbd5e1">∅</text>
  <rect x="1110" y="363" width="48" height="28" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="1164" y="363" width="48" height="28" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>

  <!-- order=3 - costly border -->
  <rect x="48" y="404" width="1184" height="42" rx="6" fill="#fefce8" stroke="#fde68a" stroke-width="1.5"/>
  <text x="64" y="428" font-size="11" font-weight="700" fill="#a16207">order 3</text>
  <text x="136" y="428" font-size="10" fill="#94a3b8">4 KB × 8 = 32 KB</text>
  <rect x="826" y="411" width="96" height="28" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="836" y="428" font-size="9" fill="#cbd5e1">∅</text>
  <rect x="928" y="411" width="96" height="28" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="938" y="428" font-size="9" fill="#059669">●──●──●</text>
  <rect x="1030" y="411" width="74" height="28" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="1110" y="411" width="48" height="28" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="1164" y="411" width="48" height="28" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="708" y="428" font-size="8" fill="#f59e0b">← PCP upper bound</text>

  <!-- order=4 -->
  <rect x="48" y="452" width="1184" height="42" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
  <text x="64" y="476" font-size="11" font-weight="700" fill="#be123c">order 4</text>
  <text x="136" y="476" font-size="10" fill="#94a3b8">4 KB × 16 = 64 KB</text>
  <rect x="826" y="459" width="96" height="28" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="836" y="476" font-size="9" fill="#cbd5e1">∅</text>
  <rect x="928" y="459" width="96" height="28" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="938" y="476" font-size="9" fill="#059669">●──●──●──●</text>
  <rect x="1030" y="459" width="74" height="28" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="1110" y="459" width="48" height="28" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="1164" y="459" width="48" height="28" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="708" y="476" font-size="8" fill="#f43f5e">← direct buddy (zone lock)</text>

  <!-- order=5 -->
  <rect x="48" y="500" width="1184" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="64" y="524" font-size="11" font-weight="700" fill="#475569">order 5</text>
  <text x="136" y="524" font-size="10" fill="#94a3b8">4 KB × 32 = 128 KB</text>
  <rect x="928" y="507" width="96" height="28" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="938" y="524" font-size="9" fill="#059669">●──●──●──●</text>

  <!-- order=6 -->
  <rect x="48" y="548" width="1184" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="64" y="572" font-size="11" font-weight="700" fill="#475569">order 6</text>
  <text x="136" y="572" font-size="10" fill="#94a3b8">4 KB × 64 = 256 KB</text>
  <rect x="928" y="555" width="96" height="28" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="938" y="572" font-size="9" fill="#059669">●──●──●──●</text>

  <!-- order=7 -->
  <rect x="48" y="596" width="1184" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="64" y="620" font-size="11" font-weight="700" fill="#475569">order 7</text>
  <text x="136" y="620" font-size="10" fill="#94a3b8">4 KB × 128 = 512 KB</text>
  <rect x="928" y="603" width="96" height="28" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="938" y="620" font-size="9" fill="#059669">●──●──●</text>

  <!-- order=8 -->
  <rect x="48" y="644" width="1184" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="64" y="668" font-size="11" font-weight="700" fill="#475569">order 8</text>
  <text x="136" y="668" font-size="10" fill="#94a3b8">4 KB × 256 = 1 MB</text>
  <rect x="928" y="651" width="96" height="28" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="938" y="668" font-size="9" fill="#059669">●──●</text>

  <!-- order=9 -->
  <rect x="48" y="692" width="1184" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="64" y="716" font-size="11" font-weight="700" fill="#475569">order 9</text>
  <text x="136" y="716" font-size="10" fill="#94a3b8">4 KB × 512 = 2 MB</text>
  <rect x="928" y="699" width="96" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="938" y="716" font-size="9" fill="#1d4ed8">●──●</text>

  <!-- order=10 MAX -->
  <rect x="48" y="740" width="1184" height="42" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  <text x="64" y="764" font-size="11" font-weight="700" fill="#92400e">order 10</text>
  <text x="136" y="764" font-size="10" fill="#92400e">4 KB × 1024 = 4 MB (MAX)</text>
  <rect x="928" y="747" width="96" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="938" y="764" font-size="9" fill="#1d4ed8">●</text>

  <!-- ==================== Bottom: PCP section ==================== -->
  <rect x="30" y="814" width="1220" height="154" rx="10" fill="#fff" filter="url(#shadow-md)"/>
  <rect x="30" y="814" width="1220" height="36" rx="10" fill="#1e40af"/>
  <rect x="30" y="838" width="1220" height="12" fill="#1e40af"/>
  <text x="50" y="837" font-size="13" font-weight="700" fill="#bfdbfe">per_cpu_pageset — Per-CPU 页缓存 (每个 CPU 独立一份)</text>

  <!-- CPU 0 -->
  <rect x="48" y="860" width="370" height="96" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="64" y="880" font-size="11" font-weight="700" fill="#1e40af">CPU 0</text>
  <text x="110" y="880" font-size="10" fill="#6b7280">struct per_cpu_pages</text>

  <rect x="64" y="890" width="75" height="24" rx="5" fill="#dbeafe"/>
  <text x="72" y="906" font-size="10" font-weight="600" fill="#2563eb">lock</text>

  <rect x="148" y="890" width="80" height="24" rx="5" fill="#fef3c7"/>
  <text x="156" y="906" font-size="10" font-weight="600" fill="#d97706">count = 0</text>

  <rect x="237" y="890" width="85" height="24" rx="5" fill="#fef3c7"/>
  <text x="245" y="906" font-size="10" font-weight="600" fill="#d97706">high = 819</text>

  <rect x="331" y="890" width="70" height="24" rx="5" fill="#fef3c7"/>
  <text x="339" y="906" font-size="10" font-weight="600" fill="#d97706">batch = 63</text>

  <text x="64" y="930" font-size="9" font-weight="600" fill="#6b7280">lists[0..11]:</text>
  <text x="128" y="930" font-size="8" fill="#9ca3af">order 0~3 × {UNMOVABLE, MOVABLE, RECLAIMABLE}</text>
  <text x="64" y="945" font-size="8" fill="#d1d5db">∅ . . . . . . . . . . . ∅ (12 slots, all empty)</text>

  <!-- CPU 1 -->
  <rect x="434" y="860" width="370" height="96" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="450" y="880" font-size="11" font-weight="700" fill="#1e40af">CPU 1</text>
  <text x="496" y="880" font-size="10" fill="#6b7280">struct per_cpu_pages</text>

  <rect x="450" y="890" width="75" height="24" rx="5" fill="#dbeafe"/>
  <text x="458" y="906" font-size="10" font-weight="600" fill="#2563eb">lock</text>

  <rect x="534" y="890" width="80" height="24" rx="5" fill="#fef3c7"/>
  <text x="542" y="906" font-size="10" font-weight="600" fill="#d97706">count = 0</text>

  <rect x="623" y="890" width="85" height="24" rx="5" fill="#fef3c7"/>
  <text x="631" y="906" font-size="10" font-weight="600" fill="#d97706">high = 819</text>

  <rect x="717" y="890" width="70" height="24" rx="5" fill="#fef3c7"/>
  <text x="725" y="906" font-size="10" font-weight="600" fill="#d97706">batch = 63</text>

  <text x="450" y="930" font-size="9" font-weight="600" fill="#6b7280">lists[0..11]:</text>
  <text x="514" y="930" font-size="8" fill="#9ca3af">(同上，12 slots 全部为空)</text>

  <!-- CPU 2..N -->
  <rect x="820" y="860" width="410" height="96" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="836" y="880" font-size="11" font-weight="700" fill="#1e40af">CPU 2..N-1</text>
  <text x="914" y="880" font-size="10" fill="#6b7280">同上，count=0, lists 全空</text>

  <text x="836" y="905" font-size="9" fill="#6b7280">首次分配时触发填充:</text>
  <text x="836" y="920" font-size="9" font-family="monospace" fill="#2563eb">rmqueue_bulk(zone, order, batch=63, pcp→lists, migratetype)</text>
  <text x="836" y="936" font-size="8" fill="#9ca3af">从 buddy free_area 批量取 63 页 → 填充 PCP → 返回 1 页给调用者</text>
  <text x="836" y="950" font-size="8" fill="#9ca3af">后续 order≤3 的分配/释放直接操作 PCP lists，无需持有 zone lock</text>

  <!-- ==================== Legend Bar ==================== -->
  <rect x="30" y="980" width="1220" height="88" rx="10" fill="#fff" filter="url(#shadow-sm)"/>

  <text x="50" y="1002" font-size="11" font-weight="700" fill="#374151">图例</text>

  <rect x="50" y="1012" width="18" height="14" rx="3" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="76" y="1024" font-size="9" fill="#374151">MOVABLE 有页 (memblock 释放)</text>

  <rect x="200" y="1012" width="18" height="14" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="226" y="1024" font-size="9" fill="#374151">MOVABLE 有页 · 大块</text>

  <rect x="340" y="1012" width="18" height="14" rx="3" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="366" y="1024" font-size="9" fill="#374151">其他 migrate type (空)</text>

  <rect x="492" y="1012" width="18" height="14" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="518" y="1024" font-size="9" fill="#374151">PCP 域</text>

  <text x="610" y="1024" font-size="9" fill="#9ca3af">∅ = 链表空</text>
  <text x="700" y="1024" font-size="9" fill="#f59e0b">金色 = 已填充数值</text>
  <text x="820" y="1024" font-size="9" fill="#f43f5e">红色 = 边界标识</text>

  <text x="50" y="1055" font-size="8" fill="#9ca3af">注: 所有空闲页初始均为 MIGRATE_MOVABLE。memblock 释放大段连续区间时 buddy 自动合并到最高可行的 order。pageblock_order=4MB (order10) 限制最大块大小。</text>

</svg>
