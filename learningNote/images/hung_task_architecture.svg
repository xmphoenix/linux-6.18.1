<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 820" font-family="'Segoe UI','Noto Sans SC',Arial,sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <!-- Gradients -->
    <linearGradient id="hdrUser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="hdrSysctl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0891b2"/><stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="hdrKhung" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="hdrDetect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ea580c"/><stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="hdrPanic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be123c"/><stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="hdrPM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="hdrRCU" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="hdrOutput" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <!-- Arrow markers -->
    <marker id="aBlk" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <marker id="aRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <marker id="aGrn" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#059669" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <marker id="aBlu" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <marker id="aOrg" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <marker id="aCyn" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#0891b2" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <marker id="aPnk" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#be123c" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="530" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Hung Task 检测机制 — 软件架构总览</text>
  <text x="530" y="52" text-anchor="middle" font-size="11" fill="#64748b">kernel/hung_task.c · include/linux/hung_task.h · include/linux/sched.h</text>

  <!-- ============ 1. User Space ============ -->
  <g transform="translate(310,70)" filter="url(#sh)">
    <rect width="440" height="72" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <rect width="440" height="30" rx="8" fill="url(#hdrUser)"/>
    <rect y="22" width="440" height="8" fill="#7c3aed"/>
    <text x="220" y="20" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">用户空间 (User Space)</text>
    <text x="15" y="48" font-size="11" fill="#7c3aed" font-weight="bold">/proc/sys/kernel/hung_task_*</text>
    <text x="425" y="48" text-anchor="end" font-size="10" fill="#6b7280">sysctl 调优接口</text>
    <text x="15" y="64" font-size="10" fill="#6b7280" font-family="monospace">echo 120 &gt; /proc/sys/kernel/hung_task_timeout_secs</text>
  </g>

  <!-- Arrow: User → Sysctl -->
  <path d="M530,142 L530,180" fill="none" stroke="#0891b2" stroke-width="2" marker-end="url(#aCyn)"/>
  <rect x="455" y="152" width="150" height="18" rx="3" fill="white" fill-opacity="0.95"/>
  <text x="530" y="165" text-anchor="middle" font-size="10" fill="#0891b2">proc_dohung_task_*</text>

  <!-- ============ 2. Sysctl Subsystem ============ -->
  <g transform="translate(310,182)" filter="url(#sh)">
    <rect width="440" height="80" rx="8" fill="#fff" stroke="#0891b2" stroke-width="2"/>
    <rect width="440" height="30" rx="8" fill="url(#hdrSysctl)"/>
    <rect y="22" width="440" height="8" fill="#0891b2"/>
    <text x="220" y="20" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">sysctl 子系统</text>
    <text x="15" y="48" font-size="10" fill="#0891b2" font-weight="bold">hung_task_sysctls[] 表</text>
    <text x="15" y="62" font-size="10" fill="#374151" font-family="monospace">register_sysctl_init("kernel", hung_task_sysctls)</text>
    <text x="15" y="74" font-size="10" fill="#6b7280">写入 timeout 时调用 wake_up_process(watchdog_task)</text>
  </g>

  <!-- Arrow: Sysctl → khungtaskd -->
  <path d="M530,262 L530,310" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#aRed)"/>
  <rect x="455" y="274" width="150" height="18" rx="3" fill="white" fill-opacity="0.95"/>
  <text x="530" y="287" text-anchor="middle" font-size="10" fill="#dc2626">唤醒 / 参数传递</text>

  <!-- ============ 3. khungtaskd (Core) ============ -->
  <g transform="translate(190,312)" filter="url(#sh)">
    <rect width="680" height="190" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2.5"/>
    <rect width="680" height="32" rx="8" fill="url(#hdrKhung)"/>
    <rect y="24" width="680" height="8" fill="#dc2626"/>
    <text x="340" y="22" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">khungtaskd 内核线程 (watchdog)</text>
    <text x="15" y="50" font-size="10" fill="#dc2626" font-weight="bold">kernel/hung_task.c — 检测核心</text>

    <!-- Left column: main loop -->
    <rect x="15" y="62" width="300" height="118" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="165" y="78" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="bold">主循环 watchdog()</text>
    <line x1="25" y1="84" x2="305" y2="84" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="25" y="98" font-size="10" fill="#374151" font-family="monospace">schedule_timeout_interruptible(t)</text>
    <text x="25" y="114" font-size="10" fill="#374151" font-family="monospace">check_hung_uninterruptible_tasks()</text>
    <text x="25" y="130" font-size="10" fill="#374151" font-family="monospace">  for_each_process_thread(g, t)</text>
    <text x="25" y="146" font-size="10" fill="#374151" font-family="monospace">    check_hung_task(t, timeout)</text>
    <text x="25" y="162" font-size="10" fill="#6b7280">每 interval 秒检查一轮</text>
    <text x="25" y="175" font-size="10" fill="#6b7280">每 100ms rcu_lock_break()</text>

    <!-- Right column: detection logic -->
    <rect x="340" y="62" width="325" height="118" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
    <text x="502" y="78" text-anchor="middle" font-size="11" fill="#9a3412" font-weight="bold">判定逻辑 task_is_hung()</text>
    <line x1="350" y1="84" x2="655" y2="84" stroke="#fdba74" stroke-width="0.8"/>
    <text x="350" y="98" font-size="10" fill="#374151" font-family="monospace">state &amp; TASK_UNINTERRUPTIBLE ?</text>
    <text x="350" y="114" font-size="10" fill="#374151" font-family="monospace">排除 KILLABLE / IDLE / FROZEN</text>
    <text x="350" y="130" font-size="10" fill="#374151" font-family="monospace">switch_count == last_switch_count ?</text>
    <text x="350" y="146" font-size="10" fill="#374151" font-family="monospace">jiffies - last_switch_time &gt; timeout*HZ ?</text>
    <text x="350" y="162" font-size="10" fill="#ea580c" font-weight="bold">→ true = 判定为 hung</text>
    <text x="350" y="175" font-size="10" fill="#6b7280">trace_sched_process_hang(t)</text>
  </g>

  <!-- ============ 4. Bottom row: PM / RCU / Panic / Output ============ -->

  <!-- Arrow: khungtaskd → PM (left) -->
  <path d="M250,502 L250,540 L120,540 L120,580" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#aGrn)"/>
  <rect x="62" y="545" width="116" height="18" rx="3" fill="white" fill-opacity="0.95"/>
  <text x="120" y="558" text-anchor="middle" font-size="10" fill="#059669">hungtask_pm_notify</text>

  <!-- PM notifier box -->
  <g transform="translate(20,582)" filter="url(#sh)">
    <rect width="200" height="105" rx="8" fill="#fff" stroke="#059669" stroke-width="2"/>
    <rect width="200" height="30" rx="8" fill="url(#hdrPM)"/>
    <rect y="22" width="200" height="8" fill="#059669"/>
    <text x="100" y="20" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">PM Notifier</text>
    <text x="15" y="48" font-size="10" fill="#059669" font-weight="bold">电源管理集成</text>
    <line x1="10" y1="54" x2="190" y2="54" stroke="#a7f3d0" stroke-width="0.8"/>
    <text x="15" y="68" font-size="10" fill="#374151" font-family="monospace">SUSPEND_PREPARE</text>
    <text x="15" y="82" font-size="10" fill="#374151">→ suspended = true</text>
    <text x="15" y="96" font-size="10" fill="#374151" font-family="monospace">POST_SUSPEND</text>
    <text x="185" y="96" text-anchor="end" font-size="10" fill="#374151">→ false</text>
  </g>

  <!-- Arrow: khungtaskd → RCU -->
  <path d="M390,502 L390,580" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#aBlu)"/>
  <rect x="325" y="540" width="130" height="18" rx="3" fill="white" fill-opacity="0.95"/>
  <text x="390" y="553" text-anchor="middle" font-size="10" fill="#2563eb">rcu_lock_break()</text>

  <!-- RCU box -->
  <g transform="translate(280,582)" filter="url(#sh)">
    <rect width="220" height="105" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <rect width="220" height="30" rx="8" fill="url(#hdrRCU)"/>
    <rect y="22" width="220" height="8" fill="#2563eb"/>
    <text x="110" y="20" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">RCU 子系统</text>
    <text x="15" y="48" font-size="10" fill="#2563eb" font-weight="bold">进程遍历保护</text>
    <line x1="10" y1="54" x2="210" y2="54" stroke="#bfdbfe" stroke-width="0.8"/>
    <text x="15" y="68" font-size="10" fill="#374151" font-family="monospace">rcu_read_lock()</text>
    <text x="15" y="82" font-size="10" fill="#374151" font-family="monospace">HUNG_TASK_LOCK_BREAK</text>
    <text x="15" y="96" font-size="10" fill="#6b7280">= HZ/10 (每100ms释放)</text>
  </g>

  <!-- Arrow: khungtaskd → Panic -->
  <path d="M640,502 L640,540 L700,540 L700,580" fill="none" stroke="#be123c" stroke-width="1.8" marker-end="url(#aPnk)"/>
  <rect x="635" y="545" width="130" height="18" rx="3" fill="white" fill-opacity="0.95"/>
  <text x="700" y="558" text-anchor="middle" font-size="10" fill="#be123c">hung_task_call_panic</text>

  <!-- Panic box -->
  <g transform="translate(570,582)" filter="url(#sh)">
    <rect width="220" height="105" rx="8" fill="#fff" stroke="#be123c" stroke-width="2"/>
    <rect width="220" height="30" rx="8" fill="url(#hdrPanic)"/>
    <rect y="22" width="220" height="8" fill="#be123c"/>
    <text x="110" y="20" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Panic 子系统</text>
    <text x="15" y="48" font-size="10" fill="#be123c" font-weight="bold">panic_notifier_list</text>
    <line x1="10" y1="54" x2="210" y2="54" stroke="#fecdd3" stroke-width="0.8"/>
    <text x="15" y="68" font-size="10" fill="#374151" font-family="monospace">panic_block.notifier_call</text>
    <text x="15" y="82" font-size="10" fill="#374151">= hung_task_panic()</text>
    <text x="15" y="96" font-size="10" fill="#be123c" font-weight="bold">panic("hung_task: blocked")</text>
  </g>

  <!-- Arrow: khungtaskd → Output -->
  <path d="M810,502 L810,540 L920,540 L920,580" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#aBlk)"/>
  <rect x="838" y="545" width="130" height="18" rx="3" fill="white" fill-opacity="0.95"/>
  <text x="903" y="558" text-anchor="middle" font-size="10" fill="#7c3aed">告警输出路径</text>

  <!-- Output box -->
  <g transform="translate(840,582)" filter="url(#sh)">
    <rect width="200" height="105" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <rect width="200" height="30" rx="8" fill="url(#hdrOutput)"/>
    <rect y="22" width="200" height="8" fill="#7c3aed"/>
    <text x="100" y="20" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">告警输出</text>
    <text x="15" y="48" font-size="10" fill="#7c3aed" font-weight="bold">多维度信息输出</text>
    <line x1="10" y1="54" x2="190" y2="54" stroke="#ddd6fe" stroke-width="0.8"/>
    <text x="15" y="68" font-size="10" fill="#374151" font-family="monospace">pr_err() 告警日志</text>
    <text x="15" y="82" font-size="10" fill="#374151" font-family="monospace">sched_show_task()</text>
    <text x="15" y="96" font-size="10" fill="#374151" font-family="monospace">debug_show_all_locks()</text>
  </g>

  <!-- ============ Legend ============ -->
  <g transform="translate(15,70)">
    <rect width="175" height="120" rx="6" fill="white" fill-opacity="0.92" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="18" font-size="11" font-weight="bold" fill="#475569">图例</text>
    <line x1="12" y1="25" x2="163" y2="25" stroke="#e2e8f0" stroke-width="0.8"/>
    <line x1="12" y1="42" x2="50" y2="42" stroke="#dc2626" stroke-width="2.5"/>
    <text x="58" y="46" font-size="10" fill="#374151">核心检测线程</text>
    <line x1="12" y1="60" x2="50" y2="60" stroke="#0891b2" stroke-width="2"/>
    <text x="58" y="64" font-size="10" fill="#374151">sysctl 配置通路</text>
    <line x1="12" y1="78" x2="50" y2="78" stroke="#059669" stroke-width="1.8"/>
    <text x="58" y="82" font-size="10" fill="#374151">PM 集成</text>
    <line x1="12" y1="96" x2="50" y2="96" stroke="#2563eb" stroke-width="1.8"/>
    <text x="58" y="100" font-size="10" fill="#374151">RCU 保护</text>
    <line x1="12" y1="114" x2="50" y2="114" stroke="#be123c" stroke-width="1.8"/>
    <text x="58" y="118" font-size="10" fill="#374151">Panic 路径</text>
  </g>

  <!-- ============ Init flow annotation (right side) ============ -->
  <g transform="translate(780,70)">
    <rect width="260" height="100" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="12" y="18" font-size="11" font-weight="bold" fill="#166534">初始化路径 (subsys_initcall)</text>
    <line x1="8" y1="25" x2="252" y2="25" stroke="#86efac" stroke-width="0.8"/>
    <text x="12" y="42" font-size="10" fill="#374151" font-family="monospace">hung_task_init()</text>
    <text x="20" y="56" font-size="10" fill="#6b7280">├ atomic_notifier_chain_register</text>
    <text x="20" y="70" font-size="10" fill="#6b7280">├ pm_notifier(hungtask_pm_notify)</text>
    <text x="20" y="84" font-size="10" fill="#6b7280">├ kthread_run(watchdog,"khungtaskd")</text>
    <text x="20" y="98" font-size="10" fill="#6b7280">└ hung_task_sysctl_init()</text>
  </g>

  <!-- Bottom annotation -->
  <text x="530" y="710" text-anchor="middle" font-size="10" fill="#94a3b8">Linux 6.18.1 · kernel/hung_task.c · 检测 TASK_UNINTERRUPTIBLE 超时进程</text>
</svg>
