<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 780" font-family="'Segoe UI','Noto Sans SC',Arial,sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/></filter>
    <linearGradient id="hdrMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/><stop offset="100%" style="stop-color:#4338ca"/>
    </linearGradient>
    <linearGradient id="hdrFree" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/><stop offset="100%" style="stop-color:#047857"/>
    </linearGradient>
    <linearGradient id="hdrKmalloc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/><stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <marker id="arrP" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#047857" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M1,1 L9,3.5 L1,6" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="530" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">【图 5.4-1】SLUB Debug 对象内存布局与毒化模式</text>
  <text x="530" y="48" text-anchor="middle" font-size="11" fill="#64748b">源码: mm/slub.c — init_object() / check_object() / setup_slab_debug()</text>

  <!-- ==================== 使用态对象 (ACTIVE) ==================== -->
  <g transform="translate(30,70)">
    <rect width="1000" height="200" rx="8" fill="#fff" stroke="#6366f1" stroke-width="2" filter="url(#sh)"/>
    <rect width="1000" height="32" rx="8" fill="url(#hdrMain)"/>
    <rect x="0" y="24" width="1000" height="8" fill="#4338ca"/>
    <text x="500" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">使用态对象 (SLUB_RED_ACTIVE) — kfree() 前的内存视图</text>

    <!-- Left Redzone -->
    <rect x="15" y="50" width="120" height="60" rx="4" fill="#fce4ec" stroke="#e57373" stroke-width="1.5"/>
    <text x="75" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#c62828">Left Redzone</text>
    <text x="75" y="86" text-anchor="middle" font-size="20" font-weight="bold" fill="#c62828" font-family="monospace">0xcc</text>
    <text x="75" y="102" text-anchor="middle" font-size="9" fill="#64748b">red_left_pad 字节</text>

    <!-- Object Body -->
    <rect x="145" y="50" width="280" height="60" rx="4" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5"/>
    <text x="285" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#283593">Object Body (用户数据)</text>
    <text x="285" y="86" text-anchor="middle" font-size="11" fill="#283593" font-family="monospace">用户可读写区域</text>
    <text x="285" y="102" text-anchor="middle" font-size="9" fill="#64748b">object_size 字节</text>

    <!-- Right Redzone -->
    <rect x="435" y="50" width="120" height="60" rx="4" fill="#fce4ec" stroke="#e57373" stroke-width="1.5"/>
    <text x="495" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#c62828">Right Redzone</text>
    <text x="495" y="86" text-anchor="middle" font-size="20" font-weight="bold" fill="#c62828" font-family="monospace">0xcc</text>
    <text x="495" y="102" text-anchor="middle" font-size="9" fill="#64748b">inuse - object_size</text>

    <!-- Metadata: FP -->
    <rect x="565" y="50" width="80" height="60" rx="4" fill="#e0f2f1" stroke="#80cbc4" stroke-width="1"/>
    <text x="605" y="70" text-anchor="middle" font-size="9" font-weight="bold" fill="#00695c">FP</text>
    <text x="605" y="86" text-anchor="middle" font-size="9" fill="#00695c">(可选)</text>
    <text x="605" y="100" text-anchor="middle" font-size="8" fill="#64748b">Freelist Ptr</text>

    <!-- Metadata: Track -->
    <rect x="655" y="50" width="180" height="60" rx="4" fill="#fff3e0" stroke="#ffb74d" stroke-width="1"/>
    <text x="745" y="70" text-anchor="middle" font-size="9" font-weight="bold" fill="#e65100">track[ALLOC] + track[FREE]</text>
    <text x="745" y="86" text-anchor="middle" font-size="9" fill="#e65100">addr / cpu / pid / when</text>
    <text x="745" y="100" text-anchor="middle" font-size="8" fill="#64748b">SLAB_STORE_USER</text>

    <!-- Metadata: orig_size -->
    <rect x="845" y="50" width="60" height="60" rx="4" fill="#fce4ec" stroke="#ef9a9a" stroke-width="1"/>
    <text x="875" y="70" text-anchor="middle" font-size="9" font-weight="bold" fill="#c62828">orig</text>
    <text x="875" y="86" text-anchor="middle" font-size="9" fill="#c62828">_size</text>
    <text x="875" y="100" text-anchor="middle" font-size="8" fill="#64748b">4 字节</text>

    <!-- Padding -->
    <rect x="915" y="50" width="70" height="60" rx="4" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1"/>
    <text x="950" y="70" text-anchor="middle" font-size="9" font-weight="bold" fill="#7b1fa2">Padding</text>
    <text x="950" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#7b1fa2" font-family="monospace">0x5a</text>
    <text x="950" y="102" text-anchor="middle" font-size="8" fill="#64748b">POISON_INUSE</text>

    <!-- Size markers -->
    <line x1="15" y1="125" x2="135" y2="125" stroke="#999" stroke-width="0.8"/>
    <text x="75" y="140" text-anchor="middle" font-size="8" fill="#666">← red_left_pad →</text>
    <line x1="145" y1="125" x2="425" y2="125" stroke="#999" stroke-width="0.8"/>
    <text x="285" y="140" text-anchor="middle" font-size="8" fill="#666">← s-&gt;object_size →</text>
    <line x1="145" y1="150" x2="555" y2="150" stroke="#999" stroke-width="0.8"/>
    <text x="350" y="165" text-anchor="middle" font-size="8" fill="#666">← s-&gt;inuse →</text>
    <line x1="15" y1="175" x2="985" y2="175" stroke="#999" stroke-width="0.8"/>
    <text x="500" y="190" text-anchor="middle" font-size="8" fill="#666">← s-&gt;size (含 red_left_pad) →</text>
  </g>

  <!-- ==================== 空闲态对象 (INACTIVE) ==================== -->
  <g transform="translate(30,295)">
    <rect width="1000" height="200" rx="8" fill="#fff" stroke="#10b981" stroke-width="2" filter="url(#sh)"/>
    <rect width="1000" height="32" rx="8" fill="url(#hdrFree)"/>
    <rect x="0" y="24" width="1000" height="8" fill="#047857"/>
    <text x="500" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">空闲态对象 (SLUB_RED_INACTIVE) — kfree() 后的内存视图</text>

    <!-- Left Redzone -->
    <rect x="15" y="50" width="120" height="60" rx="4" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
    <text x="75" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e7d32">Left Redzone</text>
    <text x="75" y="86" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32" font-family="monospace">0xbb</text>
    <text x="75" y="102" text-anchor="middle" font-size="9" fill="#64748b">SLUB_RED_INACTIVE</text>

    <!-- Poison Body -->
    <rect x="145" y="50" width="230" height="60" rx="4" fill="#fff8e1" stroke="#ffd54f" stroke-width="1.5"/>
    <text x="260" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#f57f17">Poison Body</text>
    <text x="260" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#f57f17" font-family="monospace">0x6b 0x6b ... 0x6b</text>
    <text x="260" y="102" text-anchor="middle" font-size="9" fill="#64748b">POISON_FREE × (N-1)</text>

    <!-- Poison End -->
    <rect x="385" y="50" width="40" height="60" rx="4" fill="#fbe9e7" stroke="#ff8a65" stroke-width="1.5"/>
    <text x="405" y="68" text-anchor="middle" font-size="9" font-weight="bold" fill="#d84315">End</text>
    <text x="405" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#d84315" font-family="monospace">0xa5</text>
    <text x="405" y="102" text-anchor="middle" font-size="7" fill="#64748b">POISON_END</text>

    <!-- Right Redzone -->
    <rect x="435" y="50" width="120" height="60" rx="4" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
    <text x="495" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e7d32">Right Redzone</text>
    <text x="495" y="86" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32" font-family="monospace">0xbb</text>
    <text x="495" y="102" text-anchor="middle" font-size="9" fill="#64748b">SLUB_RED_INACTIVE</text>

    <!-- Metadata: FP -->
    <rect x="565" y="50" width="80" height="60" rx="4" fill="#e0f2f1" stroke="#80cbc4" stroke-width="1"/>
    <text x="605" y="70" text-anchor="middle" font-size="9" font-weight="bold" fill="#00695c">Freepointer</text>
    <text x="605" y="86" text-anchor="middle" font-size="9" fill="#00695c">→ next free</text>
    <text x="605" y="100" text-anchor="middle" font-size="8" fill="#64748b">XOR 加密</text>

    <!-- Track ALLOC -->
    <rect x="655" y="50" width="90" height="60" rx="4" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1"/>
    <text x="700" y="70" text-anchor="middle" font-size="9" font-weight="bold" fill="#1565c0">track[ALLOC]</text>
    <text x="700" y="86" text-anchor="middle" font-size="8" fill="#1565c0">分配时调用栈</text>
    <text x="700" y="100" text-anchor="middle" font-size="8" fill="#64748b">addr/cpu/pid</text>

    <!-- Track FREE -->
    <rect x="755" y="50" width="90" height="60" rx="4" fill="#fce4ec" stroke="#ef9a9a" stroke-width="1"/>
    <text x="800" y="70" text-anchor="middle" font-size="9" font-weight="bold" fill="#c62828">track[FREE]</text>
    <text x="800" y="86" text-anchor="middle" font-size="8" fill="#c62828">释放时调用栈</text>
    <text x="800" y="100" text-anchor="middle" font-size="8" fill="#64748b">addr/cpu/pid</text>

    <!-- orig_size + Padding -->
    <rect x="855" y="50" width="50" height="60" rx="4" fill="#fce4ec" stroke="#ef9a9a" stroke-width="1"/>
    <text x="880" y="70" text-anchor="middle" font-size="8" font-weight="bold" fill="#c62828">orig</text>
    <text x="880" y="86" text-anchor="middle" font-size="8" fill="#c62828">_size</text>

    <rect x="915" y="50" width="70" height="60" rx="4" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1"/>
    <text x="950" y="70" text-anchor="middle" font-size="9" font-weight="bold" fill="#7b1fa2">Padding</text>
    <text x="950" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#7b1fa2" font-family="monospace">0x5a</text>
    <text x="950" y="102" text-anchor="middle" font-size="8" fill="#64748b">POISON_INUSE</text>

    <!-- Annotation: kfree transition -->
    <text x="500" y="140" text-anchor="middle" font-size="9" fill="#555">释放时 init_object(s, object, SLUB_RED_INACTIVE): Red Zone → 0xbb, Object Body → 0x6b...0xa5</text>
    <text x="500" y="158" text-anchor="middle" font-size="9" fill="#555">分配时 check_object(s, slab, object, SLUB_RED_INACTIVE): 逐区域校验上述模式是否完整</text>
    <text x="500" y="176" text-anchor="middle" font-size="9" fill="#c62828" font-weight="bold">任何字节不匹配 → 触发 BUG 报告（越界写 / UAF Write / Freelist 破坏）</text>
  </g>

  <!-- ==================== kmalloc Redzone 示意 ==================== -->
  <g transform="translate(30,520)">
    <rect width="1000" height="200" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="2" filter="url(#sh)"/>
    <rect width="1000" height="32" rx="8" fill="url(#hdrKmalloc)"/>
    <rect x="0" y="24" width="1000" height="8" fill="#d97706"/>
    <text x="500" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">kmalloc Redzone — 精确请求大小保护 (示例: kmalloc(50) → kmalloc-64)</text>

    <!-- Left Redzone -->
    <rect x="15" y="50" width="80" height="60" rx="4" fill="#fce4ec" stroke="#e57373" stroke-width="1"/>
    <text x="55" y="70" text-anchor="middle" font-size="9" font-weight="bold" fill="#c62828">Left RZ</text>
    <text x="55" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828" font-family="monospace">0xcc</text>

    <!-- User requested 50 bytes -->
    <rect x="105" y="50" width="350" height="60" rx="4" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5"/>
    <text x="280" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#283593">用户请求的 50 字节 (orig_size=50)</text>
    <text x="280" y="86" text-anchor="middle" font-size="11" fill="#283593" font-family="monospace">可正常读写的区域</text>
    <text x="280" y="102" text-anchor="middle" font-size="9" fill="#64748b">偏移 [0, 49]</text>

    <!-- kmalloc Redzone (14 bytes) -->
    <rect x="465" y="50" width="140" height="60" rx="4" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="535" y="68" text-anchor="middle" font-size="10" font-weight="bold" fill="#e65100">kmalloc Redzone</text>
    <text x="535" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#e65100" font-family="monospace">0xcc × 14</text>
    <text x="535" y="102" text-anchor="middle" font-size="9" fill="#64748b">偏移 [50, 63] = object_size - orig_size</text>

    <!-- Right Redzone -->
    <rect x="615" y="50" width="80" height="60" rx="4" fill="#fce4ec" stroke="#e57373" stroke-width="1"/>
    <text x="655" y="70" text-anchor="middle" font-size="9" font-weight="bold" fill="#c62828">Right RZ</text>
    <text x="655" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828" font-family="monospace">0xcc</text>

    <!-- Metadata + Padding -->
    <rect x="705" y="50" width="200" height="60" rx="4" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>
    <text x="805" y="70" text-anchor="middle" font-size="9" font-weight="bold" fill="#616161">Metadata + Padding</text>
    <text x="805" y="86" text-anchor="middle" font-size="9" fill="#616161">FP + track[2] + orig_size(=50)</text>
    <text x="805" y="100" text-anchor="middle" font-size="8" fill="#64748b">Padding 填充 0x5a</text>

    <!-- Annotation arrows -->
    <path d="M465,120 L465,145 L535,145" fill="none" stroke="#e65100" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrO)"/>
    <text x="540" y="148" font-size="9" fill="#e65100" font-weight="bold">check_object() 额外校验: p + orig_size 到 p + object_size</text>

    <text x="500" y="175" text-anchor="middle" font-size="9" fill="#555">set_orig_size() 在 metadata 区保存原始请求大小 → get_orig_size() 读取后计算精确红区范围</text>
    <text x="500" y="192" text-anchor="middle" font-size="9" fill="#c62828" font-weight="bold">例: 写入 buf[55] → 破坏 kmalloc Redzone 偏移 [50,63] 中的 0xcc → "kmalloc Redzone overwritten"</text>
  </g>

  <!-- Legend -->
  <g transform="translate(30,740)">
    <rect width="1000" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="10" y="7" width="16" height="16" rx="2" fill="#fce4ec" stroke="#e57373" stroke-width="1"/>
    <text x="32" y="20" font-size="9" fill="#333">Red Zone (0xbb/0xcc)</text>
    <rect x="155" y="7" width="16" height="16" rx="2" fill="#fff8e1" stroke="#ffd54f" stroke-width="1"/>
    <text x="177" y="20" font-size="9" fill="#333">Poison (0x6b)</text>
    <rect x="265" y="7" width="16" height="16" rx="2" fill="#fbe9e7" stroke="#ff8a65" stroke-width="1"/>
    <text x="287" y="20" font-size="9" fill="#333">End Poison (0xa5)</text>
    <rect x="395" y="7" width="16" height="16" rx="2" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1"/>
    <text x="417" y="20" font-size="9" fill="#333">Padding (0x5a)</text>
    <rect x="515" y="7" width="16" height="16" rx="2" fill="#e8eaf6" stroke="#7986cb" stroke-width="1"/>
    <text x="537" y="20" font-size="9" fill="#333">用户数据区</text>
    <rect x="615" y="7" width="16" height="16" rx="2" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
    <text x="637" y="20" font-size="9" fill="#333">kmalloc Redzone</text>
    <rect x="755" y="7" width="16" height="16" rx="2" fill="#e0f2f1" stroke="#80cbc4" stroke-width="1"/>
    <text x="777" y="20" font-size="9" fill="#333">Freelist Ptr</text>
    <rect x="860" y="7" width="16" height="16" rx="2" fill="#fff3e0" stroke="#ffb74d" stroke-width="1"/>
    <text x="882" y="20" font-size="9" fill="#333">Track (STORE_USER)</text>
  </g>
</svg>
