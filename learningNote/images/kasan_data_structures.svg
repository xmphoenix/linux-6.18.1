<!-- Legend -->
<g transform="translate(700,380)">
  <rect width="460" height="140" rx="6" fill="#FAFAFA" fill-opacity="0.95" stroke="#E0E0E0"/>
  <text x="230" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">图例 — 数据结构所属模式</text>
  <rect x="15" y="28" width="14" height="14" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
