<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1020" viewBox="0 0 1280 1020">
  <style>
    .title { font: 700 28px sans-serif; fill: #111827; }
    .subtitle { font: 700 20px sans-serif; fill: #1f2937; }
    .label { font: 16px sans-serif; fill: #374151; }
    .small { font: 14px sans-serif; fill: #4b5563; }
    .bus { fill: none; stroke: #111827; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    .sda { fill: none; stroke: #059669; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    .guide { fill: none; stroke: #d1d5db; stroke-width: 2; stroke-dasharray: 5 5; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 2; }
    .callout { fill: #ecfdf5; stroke: #6ee7b7; stroke-width: 2; }
  </style>

  <rect x="0" y="0" width="1280" height="1020" fill="#f8fafc"/>
  <text x="40" y="48" class="title">I3C Protocol Waveforms</text>
  <text x="40" y="78" class="small">Conceptual protocol timing. The diagram emphasizes frame semantics and bus phases rather than exact analog timing.</text>

  <rect x="30" y="110" width="1220" height="220" rx="12" class="box"/>
  <text x="50" y="145" class="subtitle">1. SDR Private Transfer</text>
  <text x="60" y="190" class="label">Phase</text>
  <text x="170" y="190" class="small">START  Dynamic Address + R/W  ACK/Turnaround  Data Bytes  STOP</text>
  <text x="60" y="245" class="label">SCL</text>
  <text x="60" y="300" class="label">SDA</text>
  <polyline class="bus" points="130,230 165,230 165,285 210,285 210,230 255,230 255,285 300,285 300,230 345,230 345,285 390,285 390,230 435,230 435,285 480,285 480,230 525,230 525,285 570,285 570,230 615,230 615,285 660,285 660,230 705,230 705,285 750,285 750,230 795,230 795,285 840,285 840,230 885,230 885,285 930,285 930,230 975,230 975,285 1020,285 1020,230 1065,230 1065,285 1110,285 1110,230 1155,230"/>
  <polyline class="sda" points="130,290 150,290 165,325 550,325 570,290 820,290 840,325 1090,325 1110,290 1155,290"/>
  <text x="965" y="205" class="small">OD during arbitration/setup, then data phase can move to push-pull</text>
  <text x="965" y="235" class="small">Used for normal private read/write after dynamic address is known</text>

  <rect x="30" y="350" width="1220" height="180" rx="12" class="box"/>
  <text x="50" y="385" class="subtitle">2. Broadcast CCC Transaction</text>
  <text x="60" y="430" class="label">Sequence</text>
  <text x="180" y="430" class="small">S  0x7E + W  ACK  CCC  ACK  Optional Payload  ACK  P</text>
  <text x="60" y="480" class="label">SCL</text>
  <text x="60" y="520" class="label">SDA</text>
  <polyline class="bus" points="130,468 170,468 170,510 220,510 220,468 270,468 270,510 320,510 320,468 370,468 370,510 420,510 420,468 470,468 470,510 520,510 520,468 570,468 570,510 620,510 620,468 670,468 670,510 720,510 720,468 770,468 770,510 820,510 820,468 870,468 870,510 920,510 920,468 970,468 970,510 1020,510 1020,468 1070,468 1070,510 1120,510 1120,468 1155,468"/>
  <polyline class="sda" points="130,515 150,515 170,550 470,550 490,515 710,515 730,550 1010,550 1030,515 1155,515"/>
  <text x="950" y="500" class="small">Examples: ENEC, DISEC, RSTDAA, ENTDAA</text>

  <rect x="30" y="550" width="1220" height="210" rx="12" class="box"/>
  <text x="50" y="585" class="subtitle">3. ENTDAA Dynamic Address Assignment</text>
  <text x="60" y="630" class="label">Controller</text>
  <text x="200" y="630" class="small">S  0x7E + W  ACK  ENTDAA</text>
  <text x="60" y="670" class="label">Targets</text>
  <text x="200" y="670" class="small">PID[47:0]  BCR  DCR</text>
  <text x="60" y="710" class="label">Controller</text>
  <text x="200" y="710" class="small">Assign Dynamic Address</text>
  <text x="60" y="740" class="label">Meaning</text>
  <text x="200" y="740" class="small">Discovery, identification, and address assignment happen on the bus</text>
  <polyline class="bus" points="650,620 685,620 685,720 740,720 740,620 795,620 795,720 850,720 850,620 905,620 905,720 960,720 960,620 1015,620 1015,720 1070,720 1070,620 1125,620"/>
  <polyline class="sda" points="650,680 690,680 720,645 820,645 845,695 930,695 955,645 1040,645 1065,695 1125,695"/>
  <text x="950" y="610" class="small">Unlike I2C scanning, DAA is part of the protocol</text>

  <rect x="30" y="780" width="1220" height="200" rx="12" class="box"/>
  <text x="50" y="815" class="subtitle">4. IBI: In-Band Interrupt</text>
  <text x="60" y="860" class="label">Target</text>
  <text x="170" y="860" class="small">Requests bus, sends IBI header / optional MDB / payload</text>
  <text x="60" y="900" class="label">Controller</text>
  <text x="170" y="900" class="small">ACK or NACK, then consumes payload and dispatches event</text>
  <text x="60" y="940" class="label">Why important</text>
  <text x="170" y="940" class="small">I3C targets can signal events without a dedicated out-of-band GPIO interrupt line</text>
  <polyline class="bus" points="760,845 800,845 800,925 855,925 855,845 910,845 910,925 965,925 965,845 1020,845 1020,925 1075,925 1075,845 1130,845"/>
  <polyline class="sda" points="760,905 800,905 830,870 905,870 935,920 1010,920 1040,870 1130,870"/>
</svg>
