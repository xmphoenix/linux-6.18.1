<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880">
  <style>
    .title { font: 700 28px sans-serif; fill: #111827; }
    .subtitle { font: 700 20px sans-serif; fill: #1f2937; }
    .label { font: 16px sans-serif; fill: #374151; }
    .small { font: 14px sans-serif; fill: #4b5563; }
    .bus { fill: none; stroke: #111827; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    .sda { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    .guide { fill: none; stroke: #d1d5db; stroke-width: 2; stroke-dasharray: 5 5; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 2; }
    .callout { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; }
  </style>

  <rect x="0" y="0" width="1280" height="880" fill="#f8fafc"/>
  <text x="40" y="48" class="title">I2C Protocol Waveforms</text>
  <text x="40" y="78" class="small">Conceptual protocol timing, not an electrical or nanosecond-accurate waveform.</text>

  <rect x="30" y="110" width="1220" height="210" rx="12" class="box"/>
  <text x="50" y="145" class="subtitle">1. START and STOP Conditions</text>
  <text x="60" y="190" class="label">SCL</text>
  <text x="60" y="255" class="label">SDA</text>
  <polyline class="bus" points="130,175 250,175 250,235 320,235 320,175 390,175 390,235 460,235 460,175 590,175 590,235 660,235 660,175 730,175 730,235 800,235 800,175 940,175"/>
  <polyline class="sda" points="130,240 215,240 250,280 560,280 590,240 940,240"/>
  <line x1="250" y1="150" x2="250" y2="295" class="guide"/>
  <line x1="590" y1="150" x2="590" y2="295" class="guide"/>
  <text x="232" y="140" class="label">S</text>
  <text x="572" y="140" class="label">P</text>
  <text x="980" y="205" class="small">START: SDA falls while SCL is high</text>
  <text x="980" y="235" class="small">STOP: SDA rises while SCL is high</text>

  <rect x="30" y="340" width="1220" height="230" rx="12" class="box"/>
  <text x="50" y="375" class="subtitle">2. 7-bit Address + Write + ACK + Data + ACK</text>
  <text x="60" y="420" class="label">Bits</text>
  <text x="155" y="420" class="small">A6</text>
  <text x="245" y="420" class="small">A5</text>
  <text x="335" y="420" class="small">A4</text>
  <text x="425" y="420" class="small">A3</text>
  <text x="515" y="420" class="small">A2</text>
  <text x="605" y="420" class="small">A1</text>
  <text x="695" y="420" class="small">A0</text>
  <text x="785" y="420" class="small">W</text>
  <text x="868" y="420" class="small">ACK</text>
  <text x="975" y="420" class="small">D7..D0</text>
  <text x="1128" y="420" class="small">ACK</text>
  <text x="60" y="470" class="label">SCL</text>
  <text x="60" y="535" class="label">SDA</text>
  <polyline class="bus" points="130,455 160,455 160,515 205,515 205,455 250,455 250,515 295,515 295,455 340,455 340,515 385,515 385,455 430,455 430,515 475,515 475,455 520,455 520,515 565,515 565,455 610,455 610,515 655,515 655,455 700,455 700,515 745,515 745,455 790,455 790,515 835,515 835,455 880,455 880,515 925,515 925,455 970,455 970,515 1015,515 1015,455 1060,455 1060,515 1105,515 1105,455 1150,455"/>
  <polyline class="sda" points="130,520 145,520 145,560 235,560 235,520 325,520 325,560 415,560 415,520 505,520 505,560 595,560 595,520 685,520 685,560 775,560 775,520 845,520 845,560 925,560 925,520 1015,520 1015,560 1105,560 1105,520 1150,520"/>
  <text x="950" y="565" class="small">Receiver drives ACK low on the 9th clock</text>
  <text x="950" y="590" class="small">SDA changes while SCL is low, remains stable while SCL is high</text>

  <rect x="30" y="590" width="1220" height="250" rx="12" class="box"/>
  <text x="50" y="625" class="subtitle">3. Register Read with Repeated START</text>
  <text x="60" y="670" class="label">Sequence</text>
  <text x="180" y="670" class="small">S  Addr+W  ACK  Reg  ACK  Sr  Addr+R  ACK  Data  NACK  P</text>
  <text x="60" y="730" class="label">SCL</text>
  <text x="60" y="795" class="label">SDA</text>
  <polyline class="bus" points="130,715 165,715 165,775 210,775 210,715 255,715 255,775 300,775 300,715 345,715 345,775 390,775 390,715 435,715 435,775 480,775 480,715 525,715 525,775 570,775 570,715 615,715 615,775 660,775 660,715 705,715 705,775 750,775 750,715 795,715 795,775 840,775 840,715 885,715 885,775 930,775 930,715 975,715 975,775 1020,775 1020,715 1065,715 1065,775 1110,775 1110,715 1155,715"/>
  <polyline class="sda" points="130,780 150,780 165,820 400,820 420,780 610,780 630,820 845,820 865,780 1005,780 1025,820 1110,820 1130,780 1155,780"/>
  <text x="955" y="805" class="small">Sr = repeated START, no STOP between write and read phases</text>
  <text x="955" y="830" class="small">Master usually NACKs the final byte, then issues STOP</text>
</svg>
